<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>상담실 — 이 회차 갈까말까</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">

<!-- 컬러 토큰·리셋은 랜딩(index.html)과 공유한다 -->
<link rel="stylesheet" href="tokens.css">

<style>
/* ============================================================
   상담 마을 (design.md §4 메인 작업 페이지)
   에이전트 건물 6채가 늘어선 노을 골목. 배경은 CSS 그라디언트만 쓴다 —
   이미지 요청을 늘리지 않고, 건물 그림보다 튀지 않게 낮은 대비로 깐다.
   도트 픽셀 서체는 전부 걷어내고 본문체 하나로 통일한다.
   ============================================================ */
:root{
  --ui: var(--sans);
  --ui-w: 600;
  --ui-ls: 0;

  /* 골목 팔레트 — 뮤지컬 백스테이지. 공연 시작 전, 조명 트러스만 부분적으로
     켜진 무대 뒤편. 어둡되 색이 살아 있어야 공간으로 읽힌다 */
  --sky-top: #0F0D0F;
  --sky-mid: #241A1D;
  --sky-low: #3A2620;
  --sil-far: #171214;
  --sil-near: #241A18;
  --road:     #1C1613;
  --curb:     #362A20;
  --street-lamp: rgba(255,196,120,.28);

  /* 조명 트러스·기구 색 — 골목 위에 매달린 조명 바 */
  --truss:      #57504A;
  --truss-hi:   #7C7268;
  --truss-dark: #1C1815;
  --fixture:    #35302A;
  --fixture-hi: #6B6156;
  --gel-amber: rgba(255,176,96,.5);
  --gel-blue:  rgba(120,172,255,.38);
  --gel-rose:  rgba(230,120,175,.36);

  /* 무대장비·소품 — 골목 양옆에 쌓인 플라이트케이스 */
  --case:      #2A231D;
  --case-hi:   #453A2F;
  --case-edge: #171310;
  --case-latch:#8C7A4A;

  /* 회색 보도블록 — ref/angle.jpg처럼 하이앵글 대각선에서 본 아이소메트릭 타일.
     윗면 한 색 + 옆면 두 색(왼쪽이 더 밝고 오른쪽이 그늘)으로 입체를 낸다 */
  --iso-top:   #9C9C9C;
  --iso-left:  #7C7C7C;
  --iso-right: #5A5A5A;

  /* 블록 한 칸의 기준 크기. 뷰포트 높이·너비 둘 다에 걸어서
     세로로도 가로로도 화면을 넘치지 않게 한다 (design.md §8) */
  --tile: clamp(84px, min(23vh, 19vw), 290px);

  /* 건물 그림이 보도블록 각도와 안 맞아 공통적으로 앞으로(반시계 방향으로)
     기울어 보인다는 피드백 — rotateX 3D 눕히기는 효과가 너무 약해 안 보였으므로
     화면 평면에서 시계 방향으로 도는 2D rotate로 바꿔 봤었다. 그런데 덕심·시야·
     비용·이벤트 네 장은 애초에 그림 자체가 정면(3/4 정면) 시점으로 그려져
     있어서, 대각선 아이소메트릭 보도블록과는 2D 회전으로 아무리 돌려도 원천적
     으로 각도가 맞지 않는다는 게 반복 확인됐다 — 그래서 이 네 장은 회전을
     포기하고(0deg) 대신 보도블록 쪽을 그림에 맞춰 얕게(§4.5) 만든다. */
  --building-lean: 0deg;
  --building-lean-foot: 0deg;
}

.stage{
  position:relative;
  /* 높이를 확정해야 안쪽 그리드가 남은 공간을 나눠 가진다 —
     그래야 어떤 화면에서도 한 화면에 들어온다. 정 안 되면 그때만 스크롤한다. */
  height:100dvh;
  overflow-y:auto;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:clamp(8px, 2vw, 22px);
  background:
    /* 트러스 조명 세 대가 쏘아 내리는 색 빛 — 위에서 퍼져 바닥 웅덩이로 모인다 */
    radial-gradient(24% 55% at 18% 3%,  var(--gel-blue),  transparent 74%),
    radial-gradient(20% 46% at 50% 2%,  var(--gel-rose),  transparent 74%),
    radial-gradient(26% 58% at 82% 4%,  var(--gel-amber), transparent 74%),
    radial-gradient(34% 20% at 18% 96%, rgba(120,172,255,.16), transparent 72%),
    radial-gradient(28% 16% at 50% 97%, rgba(230,120,175,.12), transparent 72%),
    radial-gradient(36% 20% at 82% 96%, rgba(255,176,96,.18), transparent 72%),
    /* 무대 한가운데 떨어지는 흐린 작업등 웅덩이 */
    radial-gradient(ellipse 60% 22% at 50% 100%, rgba(255,205,150,.13), transparent 72%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
}

/* 조명 트러스 — 골목 위에 걸린 조명 바에 핀 조명(pin spot)이 한 줄로
   매달려 있다. 그러데이션 하나로는 조명 기구티가 안 나서, 클램프·하우징·
   렌즈·빔을 실제 요소로 쌓아 만든다 (이미지 0장, 마크업은 .room-top 바로 뒤) */
.truss-rig{
  /* [배치 변경] 예전엔 .stage에 absolute로 걸려 화면 맨 위 → 기본정보(.room-top)와
     겹쳤다. 이제 .room 안 흐름 요소로, 기본정보 아래·에이전트 위 한 줄을 차지한다.
     마스크로 비는 아랫부분(38%)만큼 음수 margin-bottom으로 에이전트를 끌어올려
     조명-에이전트 갭을 줄인다. */
  position:relative;
  width:100%;
  height:clamp(66px, 10vh, 110px);
  margin-bottom:clamp(-22px, -3vh, -12px);
  flex-shrink:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
  -webkit-mask-image:linear-gradient(180deg, #000 62%, transparent 97%);
          mask-image:linear-gradient(180deg, #000 62%, transparent 97%);
}
.truss-pipe{
  position:absolute;
  left:0; right:0; top:16px;
  height:9px;
  border-radius:2px;
  background:linear-gradient(180deg, var(--truss-hi) 0 32%, var(--truss) 32% 68%, var(--truss-dark) 68% 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.5);
}
.truss-lights{
  position:absolute;
  left:4%; right:4%; top:24px;
  display:flex;
  justify-content:space-between;
}
.pinspot{
  position:relative;
  width:clamp(20px, 2.05vw, 32px);
  height:clamp(46px, 7vh, 68px);
  flex:0 0 auto;
}
/* 클램프 — 트러스 파이프에 거는 고정쇠. 여기까지는 고정, 아래(.pinspot-rig)만
   조준각만큼 돈다 — 실제 요크(yoke) 마운트처럼 몸체만 회전해야 자연스럽다 */
.pinspot-clamp{
  position:absolute; top:0; left:50%;
  width:42%; height:6px;
  transform:translateX(-50%);
  border-radius:1px;
  background:linear-gradient(180deg, var(--truss-hi), var(--truss-dark));
  box-shadow:0 0 0 1.5px var(--truss-dark);
}
.pinspot-rig{
  position:absolute; left:0; right:0; top:6px; bottom:0;
  transform:rotate(var(--aim, 0deg));
  transform-origin:50% 0%;
}
/* 요크 암 두 짝 — 각진 몸통을 좌우에서 붙잡는다. 조명 기구다운 인상은
   둥근 갓이 아니라 이 마운트 구조에서 나온다 */
.pinspot-arm{
  position:absolute; top:0;
  width:13%;
  height:56%;
  background:linear-gradient(90deg, var(--fixture-hi), var(--fixture) 65%);
  border-radius:1px;
}
.pinspot-arm--l{ left:5%; }
.pinspot-arm--r{ right:5%; }
/* 배럴 — 각진 사각 기둥. 둥근 캡슐 대신 곧은 모서리로 산업용 기구답게 */
.pinspot-body{
  position:absolute; top:5%;
  left:19%; right:19%;
  height:54%;
  background:linear-gradient(100deg, var(--fixture-hi) 0 24%, var(--fixture) 32% 100%);
  border-radius:1.5px;
  box-shadow:inset 0 -3px 4px rgba(0,0,0,.55), inset 1px 0 2px rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.4);
}
/* 피벗 볼트 — 요크 암과 배럴이 맞물리는 지점 */
.pinspot-body::before, .pinspot-body::after{
  content:'';
  position:absolute; top:8%;
  width:4px; height:4px;
  border-radius:50%;
  background:var(--truss-hi);
  box-shadow:0 0 0 1px var(--truss-dark);
}
.pinspot-body::before{ left:-17%; }
.pinspot-body::after{ right:-17%; }
/* 렌즈 — 꺼진 기구는 검게, 켜진 기구는 젤 색으로 빛난다. 원형 갓 대신 각진
   젤 프레임으로 그려 완구 느낌을 뺀다 */
.pinspot-lens{
  position:absolute; top:60%; left:26%; right:26%;
  height:9%;
  background:#100D0B;
  border-radius:1px;
  box-shadow:0 0 0 1px var(--truss-dark);
}
.pinspot[data-lit="blue"] { --lit: #9CC2FF; }
.pinspot[data-lit="rose"] { --lit: #F2A8D2; }
.pinspot[data-lit="amber"]{ --lit: #FFCB8E; }
.pinspot[data-lit] .pinspot-lens{
  background:var(--lit);
  box-shadow:0 0 4px 1px var(--lit), 0 0 14px 5px var(--lit);
}
/* 켜진 기구만 요크를 살짝 돌려 무대 쪽을 겨냥한 인상을 준다 */
.pinspot[data-lit="blue"]  .pinspot-rig{ --aim: -13deg; }
.pinspot[data-lit="rose"]  .pinspot-rig{ --aim: 0deg; }
.pinspot[data-lit="amber"] .pinspot-rig{ --aim: 13deg; }
.pinspot-beam{ display:none; }
.pinspot[data-lit] .pinspot-beam{
  display:block;
  position:absolute;
  top:69%; left:50%;
  width:170px; height:58vh;
  transform:translateX(-50%);
  clip-path:polygon(42% 0, 58% 0, 100% 100%, 0% 100%);
  background:linear-gradient(180deg, var(--lit) 0%, transparent 78%);
  opacity:.3;
  mix-blend-mode:screen;
}

/* 무대장비·소품 — 골목 양옆에 쌓아 둔 플라이트케이스와 그 앞 바닥 모니터
   스피커. .room 바깥 여백에만 놓여서 부스 그림과 겹치지 않는다 (이미지 0장) */
.stage-prop{
  position:absolute;
  bottom:clamp(6px, 1.5vh, 16px);
  width:clamp(48px, 6.2vw, 96px);
  height:clamp(70px, 12.5vh, 150px);
  display:flex;
  flex-direction:column;
  gap:7%;
  pointer-events:none;
  z-index:0;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));
}
/* 케이스 본체 — 각진 사각 몸통에 이중 테두리(리브)와 네 모서리 금속 코너,
   가운데 손잡이 홈을 얹는다. 원형 요소를 다 빼서 드럼통처럼 안 보이게 한다 */
.stage-prop i{
  display:block;
  position:relative;
  border-radius:3px;
  background:
    linear-gradient(var(--case-latch), var(--case-latch)) 6% 12% / 22% 16% no-repeat,
    linear-gradient(var(--case-latch), var(--case-latch)) 72% 12% / 22% 16% no-repeat,
    linear-gradient(var(--case-latch), var(--case-latch)) 6% 74% / 22% 16% no-repeat,
    linear-gradient(var(--case-latch), var(--case-latch)) 72% 74% / 22% 16% no-repeat,
    var(--case);
  box-shadow:
    inset 0 0 0 3px var(--case-hi),
    inset 0 0 0 5px var(--case-edge);
}
.stage-prop i:first-child{ flex:1.2; }
.stage-prop i:last-child{ flex:1; }
.stage-prop i::before{
  content:'';
  position:absolute;
  left:22%; right:22%; top:42%;
  height:15%;
  background:var(--case-edge);
  border-radius:2px;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.6);
}
.stage-prop--left{ left:clamp(6px, 2.4vw, 34px); }
.stage-prop--right{ right:clamp(6px, 2.4vw, 34px); }
/* 케이스 발치의 바닥 모니터 스피커 — 사다리꼴 웨지 한 장으로 충분하다 */
.stage-prop::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:-11%;
  height:20%;
  clip-path:polygon(9% 100%, 27% 0, 73% 0, 91% 100%);
  background:linear-gradient(180deg, var(--fixture-hi), var(--fixture) 72%);
  box-shadow:0 4px 7px rgba(0,0,0,.4);
}

.room{
  position:relative;
  width:100%;
  max-width:1280px;
  display:flex;
  flex-direction:column;
  gap:clamp(6px, 1vw, 12px);
  min-height:0;
  /* 조명 트러스가 이제 .room 안(기본정보 아래)으로 들어와서, 예전처럼
     트러스를 피하려고 크게 내릴 필요가 없다 — 화면 위 여백만 살짝 준다 */
  margin-top:clamp(6px, 1.5vh, 16px);
}

/* ============================================================
   상단 — 판단 대상 한 줄
   ============================================================ */
.room-top{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-height:34px;
  /* 아래 블록들은 flex:0 0 auto라 줄어들지 않는다 — 공간이 모자라면
     그 압박이 전부 이 줄로 쏠려 찌그러진다. 줄바꿈 내용보다 작아지지
     않게 막아야 안 겹친다. 넘치면 .stage의 세로 스크롤이 받는다. */
  flex-shrink:0;
}
.btn-dot{
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:12px;
  letter-spacing:var(--ui-ls);
  background:var(--placard-bg);
  color:#3A2E1E;
  border:1px solid var(--placard-bd);
  border-radius:10px;
  padding:8px 14px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn-dot:hover{ transform:translateY(-1px); box-shadow:0 5px 12px rgba(0,0,0,.35); filter:brightness(1.04); }
.btn-dot:active{ transform:translateY(0); box-shadow:0 2px 5px rgba(0,0,0,.3); }

.ticket-info{
  font-size:13px;
  color:var(--text-sub);
  font-variant-numeric: tabular-nums;
}
.ticket-info b{ color:var(--text); font-weight:600; }
.demo-chip{
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:11px;
  color:#2A2100;
  background:var(--accent);
  border-radius:999px;
  padding:4px 10px;
  margin-left:auto;
}

/* ============================================================
   블록 — 에이전트 한 명당 보도블록 한 칸을 가진다.
   2-2-1-1 구조: 덕심(왼상)·시야(오상)·비용(왼하)·이벤트(오하)가 정사각형
   2×2로, 그 아래 컨디션 한 줄, 팀장 한 줄이 순서대로 쌓인다. 컨디션·팀장은
   위 두 정사각형을 합친 가로(2×tile)와 같고 세로만 짧다 (design.md §4.3).
   ============================================================ */
.booth-grid{
  display:grid;
  grid-template-columns:repeat(2, var(--tile));
  grid-auto-rows:var(--tile);
  justify-content:center;
  gap:clamp(14px, 2.2vh, 28px);
  flex:0 0 auto;
}
.booth-grid .booth{ width:100%; height:100%; }

/* 컨디션 위, 팀장 아래 — 둘 다 정사각형 줄과 같은 가로폭, 더 얇은 블록 */
.foot-row{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(10px, 1.6vh, 20px);
  flex:0 0 auto;
}
#lowBooth{ display:contents; }
#lowBooth .booth, .lead-bar{
  width:calc(var(--tile) * 2);
  height:calc(var(--tile) * 0.86);
  flex:0 0 auto;
}

.booth, .lead-bar{
  position:relative;
  overflow:visible;
  /* 조명 은유 — 아직 완료되지 않은 블록은 어둡다. opacity가 아니라 밝기로 (design.md §3.2) */
  filter: brightness(0.82) saturate(0.8);
  transition: filter 400ms ease-out;
}
.booth[data-state="done"], .lead-bar[data-state="done"]{ filter: brightness(1) saturate(1); }
.booth[data-state="muted"]{ filter: brightness(0.62) saturate(0.4); }

/* 이름표는 블록 위에 얹는 팻말이다 — 별도 줄을 차지하면 블록이 정사각형에서
   벗어나므로, 자리를 먹지 않게 블록 위로 겹쳐 띄운다 */
.booth-head{
  position:absolute;
  top:0; left:2px; right:2px;
  z-index:8;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;          /* 좁은 칸에서는 상태를 아랫줄로 흘린다 */
  pointer-events:none;
}
.axis-name{
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:13px;
  color:var(--light);
  letter-spacing:1px;
  white-space:nowrap;      /* '컨디션'이 '컨디/션'으로 쪼개지지 않게 */
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.5);
}
.booth-status{
  font-size:11px;
  color:var(--text-sub);
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.5);
}

.booth-body, .lead-stage{
  position:absolute;
  inset:0;
}

/* ---- 아이소메트릭 보도블록 (ref/angle.jpg) ----
   하이앵글 대각선에서 내려다본 마름모 타일. 윗면 하나 + 옆면 둘(왼쪽이
   밝고 오른쪽이 그늘)로 입체를 만들고, drop-shadow로 공중에 띄운다.
   높이(height) 기준으로 크기를 잡고 aspect-ratio로 폭을 끌어낸다 — 그래야
   "타일의 꼭짓점(peak)은 항상 컨테이너 맨 위"라는 사실이 유지되어, 건물이
   솟아오르는 .rise-stage의 시작점(bottom)을 고정 퍼센트로 맞출 수 있다. */
/* 마름모의 가로세로 비율(aspect-ratio)이 이 타일의 "각도"를 정하고, clip-path의
   y=31.8%/63.5% 지점이 두께 비율(옆면:윗면)을 정한다. 사각 4명(덕심·시야·비용·
   이벤트)은 칸 안에서 너무 작아 보인다는 피드백으로 height를 1.6배 키웠다 —
   폭도 aspect-ratio를 통해 같이 1.6배 커진다(칸보다 커져 넘치는 건
   .booth{overflow:visible}라 의도된 동작). */
.plot-ground{
  position:absolute;
  left:50%; bottom:6%;
  height:42%;
  aspect-ratio: 3.35 / 1.32;
  transform:translateX(-50%);
  filter:
    drop-shadow(0 3px 3px rgba(0,0,0,.35))
    drop-shadow(0 10px 14px rgba(0,0,0,.4));  /* 블록이 길 위에 떠 있는 그림자 */
  z-index:0;
}
/* 컨디션·팀장은 반대로 두께가 너무 두껍다는 피드백이라, 옛 얇은 비율
   (37.9/75.8/62.1, aspect-ratio 4/1.32)로 되돌린다 — 폭(칸 크기의 2배)은
   그대로 두고 옆면만 다시 얇아진다. 그래서 이 두 그룹은 이제 두께 비율
   자체가 달라 clip-path를 공유할 수 없어 아래에서 각각 따로 정의한다. */
.foot-row .plot-ground{ height:51.2%; bottom:8%; aspect-ratio: 4 / 1.32; }
.plot-ground i{ position:absolute; inset:0; display:block; }
/* 윗면 — 마름모. 대표색(#9C9C9C) 위에 에이전트 색을 옅게 얹는다.
   덕심·시야·비용·이벤트 네 그림은 정면 시점이라 타일을 깊게(두껍게) 파면
   팔수록 그림과 더 부딪힌다는 게 반복 확인됐다 — 꼭짓점 높이를 31.8%→37.9%로
   올려 옆면을 얇게 만들어(컨디션·팀장과 같은 비율) 타일을 매트에 더 가깝게
   눕힌다. 폭(aspect-ratio)은 그대로라 옆 칸과 부딪히지 않는다. */
.plot-ground i.iso-top{
  background:
    radial-gradient(65% 65% at 50% 42%, var(--agent-glow, transparent), transparent 72%),
    var(--iso-top);
  clip-path: polygon(50% 0%, 100% 37.9%, 50% 75.8%, 0% 37.9%);
}
/* 왼쪽 옆면 — 빛을 더 받는 쪽 */
.plot-ground i.iso-left{
  background:var(--iso-left);
  clip-path: polygon(0% 37.9%, 50% 75.8%, 50% 100%, 0% 62.1%);
}
/* 오른쪽 옆면 — 그늘 쪽, 가장 어둡다 */
.plot-ground i.iso-right{
  background:var(--iso-right);
  clip-path: polygon(100% 37.9%, 50% 75.8%, 50% 100%, 100% 62.1%);
}
/* 컨디션·팀장 전용 — 얇은 옛 비율 */
.foot-row .plot-ground i.iso-top{ clip-path: polygon(50% 0%, 100% 37.9%, 50% 75.8%, 0% 37.9%); }
.foot-row .plot-ground i.iso-left{ clip-path: polygon(0% 37.9%, 50% 75.8%, 50% 100%, 0% 62.1%); }
.foot-row .plot-ground i.iso-right{ clip-path: polygon(100% 37.9%, 50% 75.8%, 50% 100%, 100% 62.1%); }
@keyframes paveIdle{ 0%,100%{ opacity:1; } 50%{ opacity:.7; } }
.booth[data-state="working"] .plot-ground,
.lead-bar[data-state="working"] .plot-ground{ animation:paveIdle 2.2s ease-in-out infinite; }

/* ---- 신호등 — 타일 오른쪽 꼭짓점에 기둥이 박혀 있다 ----
   .plot-ground은 세로(height%) 기준으로 크기를 잡고 가로는 종횡비로 끌어내므로,
   꼭짓점이 .booth-body 가로 기준 몇 %에 놓이는지는 정사각형 칸과 컨디션·팀장의
   가로세로 비율이 서로 달라 완전히 다른 값이 나온다. 그래서 두 값을 따로 잡는다. */
.lamp{
  position:absolute;
  right:17%;
  bottom:32.1%;              /* 정사각형 칸의 마름모 오른쪽 꼭짓점 근사치 (37.9% 두께비 기준) */
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:4;
  pointer-events:none;
}
/* 폭이 2배가 된 마름모(위 .foot-row .plot-ground)의 오른쪽 꼭짓점 근사치 —
   가로 비율은 사각 칸과 같아졌으므로(66.7%) 가장자리까지 거리도 17%로 같다 */
.foot-row .lamp{ right:16.7%; bottom:39.8%; }
.lamp-head{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:4px 3.5px;
  background:#221C22;
  border-radius:6px;
  border:1px solid rgba(0,0,0,.6);
  box-shadow:0 3px 5px rgba(0,0,0,.4);
}
.lamp-head i{
  width:6px; height:6px;
  border-radius:50%;
  background:#4A4048;
  transition:background 300ms ease, box-shadow 300ms ease;
}
.lamp[data-sign="neg"] .lamp-head i:nth-child(1){ background:var(--neg); box-shadow:0 0 6px 2px var(--neg); }
.lamp[data-sign="neu"] .lamp-head i:nth-child(2){ background:var(--accent); box-shadow:0 0 6px 2px var(--accent); }
.lamp[data-sign="pos"] .lamp-head i:nth-child(3){ background:var(--pos); box-shadow:0 0 6px 2px var(--pos); }
.lamp-pole{
  width:4px;
  height:clamp(22px, 8vh, 50px);
  background:linear-gradient(90deg, #262119, #574F3D 45%, #262119);
  border-radius:1px;
}
.lamp-base{
  width:14px; height:5px;
  margin-top:-1px;
  background:radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,.45), transparent 75%);
  border-radius:50%;
}

/* ---- 건물이 블록 위로 솟아오르는 자리 ----
   완료(done) 전에는 타일 속에 눌려 있다가, 완료되는 순간 자라나듯 떠오른다.
   건물의 발치는 마름모 "꼭짓점"이 아니라 마름모가 가장 넓어지는 중심선
   (= plot-ground의 좌우 꼭짓점 높이, top/left/right-vertex의 y=37.9%)에
   맞춘다. 꼭짓점은 폭이 0인 점이라 거기 발을 대면 건물이 타일과 한 점에서만
   만나 허공에 떠 있는 것처럼 보인다 — 폭이 가장 넓은 지점이어야 보도블록
   위에 실제로 "앉은" 느낌이 난다. bottom을 그만큼 낮추고, top도 같은 폭만큼
   낮춰서 박스 높이(=건물 크기)는 그대로 두고 위치만 통째로 내린다 — 그래서
   말풍선(.speech, top:0 기준) 자리는 건드리지 않으면서 건물 윗부분이 말풍선
   아래로 덜 파고든다.
   실제 그림 여부와 무관하게 .rise-stage > * 로 한 번에 건다 — 이미지가
   나중에 assets/agents/에 들어와도 애니메이션은 그대로 붙는다. */
.rise-stage{
  position:absolute;
  top:calc(clamp(6px, 13%, 30px) + 16.7%); right:12%; bottom:32.1%; left:12%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:2;
  /* 그림 자체는 안 건드리고, 발밑을 축으로 시계 방향으로 살짝 돌려 보도블록
     각도에 맞춘다 — 안쪽(.rise-stage > *)의 등장 애니메이션 transform과는
     별도 레이어라 서로 간섭하지 않는다 */
  transform: rotate(var(--building-lean));
  transform-origin: 50% 100%;
}
/* 컨디션·팀장 그림(team.png에서 딴 것)은 다른 넷(agents.png)과 원본 삽화의
   카메라 각도 자체가 달라서, 같은 --building-lean을 그대로 쓰면 어긋난다 —
   그래서 이 둘만 따로 기울기를 잡는다. */
.foot-row .rise-stage{ top:18.2%; bottom:39.8%; transform: rotate(var(--building-lean-foot)); }
/* 컨디션 전용 — 기차 양끝이 보도블록 좌우 꼭짓점(16.7%~83.3%)에 딱 맞아야
   한다는 피드백. 좌우를 꼭짓점 위치(16.7%)에 물리고, 박스에 그림의 실제
   비율(1269/420)을 그대로 걸어(top:auto → 높이는 폭에서 파생) object-fit:
   contain이 박스를 가로로 꽉 채우게 한다 — 그 결과 기차 양끝이 정확히
   꼭짓점에 닿는다. bottom은 발밑이 타일 앞면에 얹히도록 낮춘다.
   그림 자체가 원근(왼쪽 기관차는 낮게, 오른쪽 객차는 높게 물러남)이라
   가로로만 맞추면 오른쪽 끝이 꼭짓점보다 떠 보인다 — 발밑(50% 100%)을 축으로
   시계 방향 3deg 돌려 오른쪽 끝을 꼭짓점 라인까지 내린다(왼쪽은 그만큼 올라와
   양끝이 같은 높이에 온다).
   팀장(#leadChar)은 아래에서 같은 방식으로 따로 잡는다. */
#lowBooth .rise-stage{
  left:16.7%; right:16.7%; top:auto;
  aspect-ratio: 1269 / 420;
  bottom:33%;
  transform: rotate(3deg);
}
.rise-stage > *{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  image-rendering:auto; /* tokens.css의 pixelated 전역 규칙을 이 이미지에서만 해제 */
  transform-origin:50% 100%;
  transition:transform 640ms cubic-bezier(.22,1.55,.4,1), opacity 380ms ease;
  transform:translateY(12%) scale(.4);
  opacity:0;
}
[data-state="done"] .rise-stage > *{
  transform:translateY(0) scale(1);
  opacity:1;
}

/* 건물 그림이 아직 없는 자리 — 파일을 넣으면 그대로 대체된다 */
.art-slot{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:2px dashed rgba(245,230,200,.28);
  border-radius:8px;
  background:rgba(0,0,0,.18);
  color:var(--light-dim);
  text-align:center;
  padding:6px;
}
.art-slot b{
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:12px;
  color:var(--light);
  letter-spacing:var(--ui-ls);
}
.art-slot small{ font-size:10px; opacity:.8; }

/* ---- 말풍선 (에이전트가 내놓는 한 줄) ----
   그림 위쪽에 놓고 꼬리를 아래로 내려 캐릭터를 가리킨다.
   신호등과 같은 삼색(초록·주황·빨강)을 테두리·꼬리 색으로 그대로 쓴다 —
   위의 신호등을 보고 내려오면 말풍선 색이 왜 그런지 설명해 주는 구조. */
.speech{
  /* 꼬리 위치는 JS(layoutTails)가 실제 그림 박스를 재서 넣는다.
     아래 값은 스크립트 실행 전 한 프레임용 기본값이다. */
  --tail: 26%;
  --sign-color: var(--neutral);
  position:absolute;
  left:4%; right:4%;
  top:0;
  z-index:6;
  background:#FFF8EA;
  border:2px solid var(--sign-color);
  border-radius:18px;
  color:#332A1E;
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:17px;
  line-height:1.3;
  letter-spacing:var(--ui-ls);
  text-align:center;
  padding:10px 14px;
  box-shadow:0 10px 22px -8px rgba(20,10,20,.55), 0 2px 5px rgba(20,10,20,.22);
  animation: speechPop 260ms cubic-bezier(.34,1.56,.64,1) both;
}
.speech.long{ font-size:13px; }
.speech[data-sign="pos"]{ --sign-color: var(--pos); }
.speech[data-sign="neg"]{ --sign-color: var(--neg); }
.speech[data-sign="neu"]{ --sign-color: var(--accent); }
/* 확신이 셀수록 테두리가 굵다 — 흔들림 대신 굵기로 강도를 말한다 */
.speech[data-strength="1"]{ border-width:3px; }
.speech[data-strength="2"]{ border-width:4px; }
.speech:hover{ filter:brightness(1.03); }
.speech.is-open{ box-shadow:0 0 0 3px var(--accent), 0 10px 22px -8px rgba(20,10,20,.55); }

/* 꼬리 — 테두리색 삼각형 위에 바탕색 삼각형을 겹쳐 테두리를 만든다 */
.speech::before,
.speech::after{
  content:'';
  position:absolute;
  top:100%;
  left:var(--tail);
  margin-left:-10px;      /* 삼각형 폭의 절반 — --tail 지점에 꼭짓점을 맞춘다 */
  width:0; height:0;
  border:10px solid transparent;
  border-bottom:0;
}
.speech::before{ border-top-color:var(--sign-color); margin-top:0; }
.speech::after{ border-top-color:#FFF8EA; margin-top:-2px; }

@keyframes speechPop{
  0%  { opacity:0; transform:translateY(7px) scale(.9); }
  100%{ opacity:1; transform:translateY(0)   scale(1); }
}

/* 확신이 없을 때 — 예전엔 둘째 줄('확실하지 않음')이 붙어 말풍선이 두꺼워져
   건물을 가렸다. 이제 판정 문구 끝에 경고 이모지 하나만 붙인다(줄 안 늘어남). */
.speech-note{
  font-size:0.92em;
  margin-left:4px;
  vertical-align:baseline;
  line-height:1;
}
.muted-line{
  font-size:12px;
  color:var(--text-dis);
}

/* 컨디션 말풍선 — 정사각형 4칸과 "같은 크기"로. 예전엔 블록 전체 폭(2타일)이라
   기차 그림을 덮었다. 폭을 1타일(4칸과 동일: 칸의 92%)로 줄이고, position:absolute
   + left/right:0 + 고정 width + margin auto 로 블록 가운데 정렬. 글자도 4칸과 동일. */
#lowBooth .speech{
  left:0; right:0;
  width:calc(var(--tile) * 0.92);
  margin-inline:auto;
  /* 블록이 얇아 top:0이면 아직 기차 위에 걸친다 — 블록 위(그리드와의 갭)로
     조금 띄운다. .booth{overflow:visible}라 밖으로 나가도 잘리지 않는다. */
  top:-7%;
  font-size:17px;
}
#lowBooth .speech.long{ font-size:13px; }
/* 컨디션 블록에서는 신호등을 왼쪽에 둔다 — 오른쪽은 팀장 쪽을 보고 있어야 자연스럽다 */
#lowBooth .lamp{ right:auto; left:16.7%; }

/* ============================================================
   팀장 본부 — 골목 끝 건물, 컨디션과 같은 얇고 넓은 블록 (design.md §4.2)
   이름표는 다른 블록과 같은 .booth-head/.axis-name을 그대로 쓴다.
   ============================================================ */
.lead-stage{
  display:flex;
  align-items:flex-end;
}
/* 팀장 그림이 판정 문구보다 작아 보인다는 피드백 — 컨디션과 같은 방식으로
   박스에 lead.png의 실제 비율(1081/420)을 aspect-ratio로 걸고 좌우를 보도블록
   좌우 꼭짓점(16.7%~83.3%, .foot-row .plot-ground 폭과 동일)에 물려
   object-fit:contain이 꼭짓점에서 꼭짓점까지 가로를 꽉 채우게 한다. 세로는
   폭에서 파생되므로 그만큼 그림도 커진다. bottom으로 발밑을 타일에 얹는다.
   판정 문구(.lead-right)는 z-index가 더 높아 커진 그림 위에 그대로 얹히고,
   텍스트 자체의 그림자로 겹쳐도 읽힌다. */
#leadChar{
  left:16.7%; right:16.7%; top:auto;
  aspect-ratio: 1081 / 420;
  bottom:34%;   /* 붕 떠 보인다는 피드백 — 발밑을 타일 안쪽으로 조금 더 내린다 */
}
.foot-row .lamp-pole{ height:clamp(14px, 5vh, 26px); }
.lead-right{
  position:relative;
  z-index:6;
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-end;
  gap:5px;
  padding:0 4px 10px 16px;
  margin-left:auto;
  max-width:50%;
}
.lead-waiting{
  font-size:13px;
  color:var(--text-sub);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
/* 판정 — 가장 크게 쓰는 자리라 작은 화면에서도 읽힌다 */
.verdict-word{
  font-family:var(--sans);
  font-weight:800;
  font-size:clamp(30px, 4.6vw, 40px);
  letter-spacing:-0.5px;
  background:none;
  border:none;
  padding:0;
  color:var(--accent);
  text-shadow:0 3px 10px rgba(0,0,0,.5);
  line-height:1.05;
}
.verdict-word[data-verdict="NO_GO"]{ color:var(--light); }
.verdict-hint{
  font-size:12px;
  color:var(--text-sub);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.alt-chip{
  font-family:var(--ui);
  font-weight:var(--ui-w);
  font-size:11px;
  background:var(--accent);
  color:#2A2100;
  padding:4px 9px;
  border-radius:999px;
}

/* 20초 초과 안내 (design.md §6.2) — 평소에는 진행 문구를 쓰지 않는다 */
.timeout-box{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(245,230,200,.18);
  border-radius:12px;
  padding:10px 12px;
}
.timeout-box span{ font-size:13px; color:var(--text); }

/* ============================================================
   말풍선 (design.md §5.3) — DOM에 하나만 두고 옮겨 다닌다.
   위의 짧은 말풍선(.speech)과 같은 색·모양 언어를 쓴다.
   ============================================================ */
.bubble{
  position:absolute;
  z-index:20;
  width:min(360px, 78vw);
  background:#FFF8EA;
  color:#2A2118;
  border:2px solid var(--placard-bd);
  border-radius:18px;
  box-shadow:0 16px 34px -10px rgba(20,10,20,.55), 0 4px 10px rgba(20,10,20,.25);
  padding:14px 16px;
}
.bubble-who{
  font-family:var(--ui);
  font-weight:700;
  font-size:12px;
  color:var(--placard-bd);
  margin-bottom:6px;
  letter-spacing:0.5px;
}
.bubble-text{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  margin:0;
}
.bubble-alt{
  margin:10px 0 0;
  padding-top:9px;
  border-top:1px solid rgba(107,88,66,.3);
  font-size:14px;
  line-height:1.6;
  color:#4A3B28;
}
.bubble-tail{
  position:absolute;
  width:0; height:0;
  border:10px solid transparent;
}
.bubble[data-dir="down"] .bubble-tail{ top:-19px; border-bottom-color:var(--placard-bd); }
.bubble[data-dir="up"]   .bubble-tail{ bottom:-19px; border-top-color:var(--placard-bd); }
.bubble-close{
  position:absolute;
  top:6px; right:8px;
  background:none; border:none;
  font-family:var(--sans);
  font-size:14px;
  color:var(--placard-bd);
}

/* ============================================================
   반응형 (design.md §8)
   블록 크기는 --tile 하나가 vh·vw 양쪽을 다 잡고 있어서 그리드 자체는
   손댈 게 없다. 여기서는 글자 크기와 팀장 블록 안쪽 배분만 조정한다.
   ============================================================ */
@media (max-width:1023px){
  .speech{ font-size:15px; }
  .speech.long{ font-size:12px; }
  #lowBooth .speech{ font-size:15px; }
  #lowBooth .speech.long{ font-size:12px; }
  /* .room이 .stage 대부분을 차지해 옆 여백이 없어지면 소품이 부스와 겹친다 */
  .stage-prop{ display:none; }
}

/* ---- 모바일 ---- */
@media (max-width:767px){
  .stage{ padding:6px 6px 0; }
  .room{ gap:6px; }
  .booth, .lead-bar{ padding:6px; }

  .axis-name{ font-size:12px; letter-spacing:0; }
  .booth-status{ font-size:10px; }
  .speech{
    font-size:14px;
    line-height:1.35;
    padding:8px 7px;
    min-height:44px;             /* 터치 타겟 */
    display:flex;
    flex-wrap:wrap;              /* 판정 문구 + 경고 이모지가 같은 줄에 오게 */
    align-items:center;
    justify-content:center;
    border-width:2px;
  }
  .speech.long{ font-size:12.5px; }
  #lowBooth .speech{ font-size:14px; }
  #lowBooth .speech.long{ font-size:12.5px; }
  .speech[data-strength="1"]{ border-width:3px; }
  .speech[data-strength="2"]{ border-width:4px; }
  .speech-note{ font-size:0.92em; }
  .ticket-info{ font-size:12px; }
  .bubble-text{ font-size:14.5px; line-height:1.65; }
  .verdict-hint, .alt-chip{ font-size:10.5px; }


  /* 컨디션·팀장이 이미 세로로 한 줄씩 쌓여 있어(가로 2×tile) 정사각형 줄과
     가로 제약이 같다 — 그래서 세로(vh)만 채워도 되고, 가로(vw) 상한은
     넉넉히 올려도 된다 */
  :root{ --tile: clamp(84px, min(23vh, 46vw), 230px); }

  /* 말풍선은 하단 고정 시트로 (게임 대사창과 동일) */
  .bubble{
    position:fixed;
    left:0; right:0; bottom:0;
    top:auto;
    width:100%;
    border-width:2px 0 0;
    border-radius:18px 18px 0 0;
    box-shadow:0 -6px 20px rgba(0,0,0,.35);
    max-height:52vh;
    overflow-y:auto;
  }
  .bubble-tail{ display:none; }
}

/* 등장 연출만 끈다. 강도는 원래 테두리 굵기로 말하므로 그대로 남는다 (design.md §5.2) */
@media (prefers-reduced-motion: reduce){
  .speech{ animation:none; }
  .booth, .lead-bar{ transition:none; }
  .rise-stage > *{ transition:none; }
  .plot-ground{ animation:none !important; }
}
</style>

<div class="stage">

      <div class="ticket-info" id="ticketInfo"></div>

    </header>

    <!-- 조명 레일 — 기본정보 줄(.room-top) 아래, 에이전트 골목 위. 흐름 요소로
         한 줄을 차지한다 (예전엔 .stage에 absolute로 걸려 기본정보와 겹쳤다) -->
    <div class="truss-rig" aria-hidden="true">

        <span class="pinspot" data-lit="blue"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
        <span class="pinspot"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
        <span class="pinspot" data-lit="rose"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
        <span class="pinspot"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
        <span class="pinspot" data-lit="amber"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
        <span class="pinspot"><i class="pinspot-clamp"></i><i class="pinspot-rig"><i class="pinspot-arm pinspot-arm--l"></i><i class="pinspot-arm pinspot-arm--r"></i><i class="pinspot-body"></i><i class="pinspot-lens"></i><i class="pinspot-beam"></i></i></span>
      </div>

    <div class="booth-grid" id="boothGrid"></div>

    <!-- 골목 끝 — 컨디션 블록과 팀장 본부 블록이 나란히 선다.
         둘 다 정사각형 2개 길이의 얇은 블록이다 (design.md §4.3) -->
    <div class="foot-row">
      <div id="lowBooth"></div>
      <div class="lead-bar" id="leadBar" data-pose="work" data-state="working">
        <div class="booth-head">
          <span class="axis-name">팀장</span>
        </div>
        <div class="lead-stage" id="leadStage">
          <div class="plot-ground"><i class="iso-top"></i><i class="iso-left"></i><i class="iso-right"></i></div>
          <div class="lamp" data-sign="off" aria-hidden="true">
            <span class="lamp-head"><i></i><i></i><i></i></span>
            <span class="lamp-pole"></span>
            <span class="lamp-base"></span>
          </div>
          <div class="rise-stage" id="leadChar"></div>
          <div class="lead-right" id="leadRight">
            <span class="lead-waiting">의견을 모으는 중…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 말풍선은 .room 안에 둔다 — 좌표를 .room 기준으로 계산하기 때문 -->
    <div class="bubble" id="bubble" hidden>
      <div class="bubble-tail"></div>
      <button type="button" class="bubble-close" id="bubbleClose">✕</button>
      <div class="bubble-who" id="bubbleWho"></div>
      <p class="bubble-text" id="bubbleText"></p>
      <p class="bubble-alt" id="bubbleAlt" hidden></p>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/supabase-config.js"></script>
<script src="data/auth.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  /* ---------------------------------------------------------
     입력 번들 — 랜딩에서 넘어온 것, 없으면 데모
  --------------------------------------------------------- */
  let bundle = null;
  try{
    const raw = sessionStorage.getItem('gon:bundle');
    if(raw) bundle = JSON.parse(raw);
  }catch(e){ /* 무시하고 데모로 */ }
  if(!bundle){
    bundle = GON.DEMO_BUNDLE;
    $('demoChip').hidden = false;
  }

  /* ---------------------------------------------------------
     에이전트 — color 는 각 건물 그림에서 뽑은 대표색이다.
     가게 바닥에 깔리는 옅은 불빛으로 쓴다 (--agent-glow).
  --------------------------------------------------------- */
  const AGENTS = [
    { key:'DEOKSIM',   label:'덕심',   color:'#6E4F76', art:'assets/agents/deoksim.png' },
    { key:'SIYA',      label:'시야',   color:'#4F6690', art:'assets/agents/siya.png' },
    { key:'COST',      label:'비용',   color:'#8C6A3A', art:'assets/agents/cost.png' },
    { key:'EVENT',     label:'이벤트', color:'#C96B79', art:'assets/agents/event.png' },
    { key:'CONDITION', label:'컨디션', color:'#A8894A', art:'assets/agents/condition.png' }
  ];

  // #RRGGBB → rgba(). 바닥 불빛에 알파를 주려면 성분이 따로 필요하다.
  function glow(hex, alpha){
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  /* ---------------------------------------------------------
     건물 그림 — 파일이 없으면 자리만 잡아 둔다.
     나중에 assets/agents/ 에 PNG를 넣으면 코드 수정 없이 그대로 붙는다.
  --------------------------------------------------------- */
  function buildingArt(src, label){
    const img = document.createElement('img');
    img.className = 'booth-art';
    img.src = src;
    img.alt = label + ' 건물';
    img.decoding = 'async';
    img.onerror = () => {
      const slot = document.createElement('div');
      slot.className = 'art-slot';
      slot.innerHTML = '<b></b><small>건물 이미지 자리</small>';
      slot.querySelector('b').textContent = label;
      img.replaceWith(slot);
    };
    return img;
  }

  /* ---------------------------------------------------------
     부스 렌더
  --------------------------------------------------------- */
  const booths = {};

  // 신호등 — 하우징(불 3알) + 기둥 + 밑판. 블록마다 하나씩 붙는다
  function buildLamp(){
    const lamp = document.createElement('div');
    lamp.className = 'lamp';
    lamp.dataset.sign = 'off';
    lamp.setAttribute('aria-hidden', 'true');
    lamp.innerHTML = '<span class="lamp-head"><i></i><i></i><i></i></span>' +
                     '<span class="lamp-pole"></span>' +
                     '<span class="lamp-base"></span>';
    return lamp;
  }

  function buildBooth(a){
    const sec = document.createElement('section');
    sec.className = 'booth';
    sec.dataset.agent = a.key;
    sec.dataset.state = 'working';
    sec.style.setProperty('--agent-glow', glow(a.color, 0.14));

    const head = document.createElement('div');
    head.className = 'booth-head';
    head.innerHTML = '<span class="axis-name">' + a.label + '</span>' +
                     '<span class="booth-status">작업 중</span>';
    sec.appendChild(head);

    const body = document.createElement('div');
    body.className = 'booth-body';
    const ground = document.createElement('div');
    ground.className = 'plot-ground';
    ground.innerHTML = '<i class="iso-top"></i><i class="iso-left"></i><i class="iso-right"></i>';
    body.appendChild(ground);

    const lamp = buildLamp();
    body.appendChild(lamp);

    // 말풍선이 먼저 와야 그림 위에 서고 꼬리가 아래 캐릭터를 가리킨다
    const speech = document.createElement('button');
    speech.type = 'button';
    speech.className = 'speech';
    speech.hidden = true;
    const line = document.createElement('span');
    line.className = 'speech-line';
    speech.appendChild(line);
    const note = document.createElement('span');
    note.className = 'speech-note';
    note.hidden = true;
    note.textContent = '⚠️';
    note.title = '좌석배치도 데이터가 부족해 확실하지 않음';
    note.setAttribute('aria-label', '확실하지 않음');
    speech.appendChild(note);
    body.appendChild(speech);

    // 건물은 완료 전엔 블록 속에 눌려 있다가, 완료되는 순간 솟아오른다 (design.md §4.3)
    const stage = document.createElement('div');
    stage.className = 'rise-stage';
    stage.appendChild(buildingArt(a.art, a.label));
    body.appendChild(stage);

    sec.appendChild(body);
    booths[a.key] = { el:sec, speech:speech, line:line, note:note, signal:lamp,
                      status:head.querySelector('.booth-status') };
    return sec;
  }

  const grid = $('boothGrid');
  AGENTS.slice(0,4).forEach(a => grid.appendChild(buildBooth(a)));
  $('lowBooth').appendChild(buildBooth(AGENTS[4]));

  // 팀장 본부 — 건물 그림이 들어올 자리. 이미 마크업에 있는 블록/신호등에 얹기만 한다
  const leadLamp = document.querySelector('#leadStage .lamp');
  $('leadChar').appendChild(buildingArt('assets/agents/lead.png', '팀장'));

  /* ---------------------------------------------------------
     말풍선 꼬리 맞추기
     그림은 object-fit:contain 이라 칸 비율에 따라 좌우 여백이 달라진다.
     캐릭터는 캔버스 폭의 14% 지점에 서 있으므로(네 장 실측), 실제로 그려진
     박스를 재서 꼬리를 그 위에 올린다. 고정값으로는 화면마다 어긋난다.

     .booth-art 자체가 아니라 .rise-stage(부모)를 잰다 — art에는 솟아오르는
     transform이 걸려 있어서, 아직 눌려 있는 동안 재면 작게 쪼그라든 크기가
     나온다. rise-stage는 transform이 없는 안정된 기준 박스다.
  --------------------------------------------------------- */
  const CHAR_X = 0.14;

  function layoutTails(){
    Object.keys(booths).forEach(k => {
      const b = booths[k];
      // 컨디션 말풍선은 블록 가운데에 1타일 폭으로 놓이므로(캐릭터는 기차 왼쪽
      // 끝) 꼬리도 말풍선 한가운데에서 내린다 — 캐릭터를 가리키면 말풍선 밖이다
      if(k === 'CONDITION'){ b.speech.style.setProperty('--tail', '50%'); return; }
      const stage = b.el.querySelector('.rise-stage');
      const img = stage ? stage.querySelector('.booth-art') : null;
      const body = b.el.querySelector('.booth-body');
      if(!body || !stage) return;
      const bb = body.getBoundingClientRect();
      if(!bb.width) return;
      if(!img || !img.naturalWidth){
        b.speech.style.setProperty('--tail', '50%');   // 그림이 없으면 가운데
        return;
      }
      const ib = stage.getBoundingClientRect();
      const sc = Math.min(ib.width / img.naturalWidth, ib.height / img.naturalHeight);
      const rw = img.naturalWidth * sc;
      const left = ib.left + (ib.width - rw) / 2 - bb.left;
      const pct = ((left + CHAR_X * rw) / bb.width) * 100;
      b.speech.style.setProperty('--tail', Math.max(8, Math.min(92, pct)).toFixed(1) + '%');
    });
  }

  // 그림 로드·칸 크기 변화 모두 꼬리 위치를 바꾼다
  document.querySelectorAll('.booth-art').forEach(img => {
    if(img.complete) return;
    img.addEventListener('load', layoutTails);
  });
  if(window.ResizeObserver){
    // --tail 은 의사요소의 left 만 바꾸므로 되먹임 루프가 생기지 않는다
    const ro = new ResizeObserver(layoutTails);
    Object.keys(booths).forEach(k => ro.observe(booths[k].el));
  }
  layoutTails();

  /* ---------------------------------------------------------
     상단 정보 한 줄
  --------------------------------------------------------- */
  (function renderTicketInfo(){
    const b = bundle;
    const bits = [];
    if(b.season.work_title) bits.push('<b>' + b.season.work_title + '</b>');
    if(b.session.date) bits.push(b.session.date + (b.session.matinee_or_evening === 'MATINEE' ? ' 낮공' : ' 밤공'));
    const seat = [b.seat.floor ? b.seat.floor + '층' : '', b.seat.block || '',
                  b.seat.row ? b.seat.row + '열' : '', b.seat.number ? b.seat.number + '번' : '']
                 .filter(Boolean).join(' ');
    if(seat) bits.push(seat);
    if(b.payment.total_paid) bits.push(Number(b.payment.total_paid).toLocaleString('ko-KR') + '원');
    $('ticketInfo').innerHTML = bits.join(' · ');
  })();

  /* ---------------------------------------------------------
     말풍선 — 하나만 두고 옮겨 다닌다. 닫고 여는 과정이 없다.
  --------------------------------------------------------- */
  const bubble = $('bubble');
  let openKey = null;

  function closeBubble(){
    bubble.hidden = true;
    openKey = null;
    document.querySelectorAll('.speech.is-open, .verdict-word.is-open')
      .forEach(el => el.classList.remove('is-open'));
  }

  function openBubble(key, who, text, alt, anchor){
    if(openKey === key){ closeBubble(); return; }
    document.querySelectorAll('.speech.is-open, .verdict-word.is-open')
      .forEach(el => el.classList.remove('is-open'));
    anchor.classList.add('is-open');
    openKey = key;

    $('bubbleWho').textContent = who;
    $('bubbleText').textContent = text;
    const altEl = $('bubbleAlt');
    if(alt){ altEl.textContent = alt; altEl.hidden = false; } else { altEl.hidden = true; }
    bubble.hidden = false;

    if(window.matchMedia('(max-width:767px)').matches){
      // 하단 고정 시트 — 인라인 좌표를 지워 CSS에 자리를 넘긴다
      bubble.style.left = '';
      bubble.style.top = '';
      return;
    }

    // 펼침 방향 자동 결정 (design.md §5.3)
    const room = $('room').getBoundingClientRect();
    const a = anchor.getBoundingClientRect();
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    const anchorMidX = a.left + a.width/2 - room.left;
    const down = (a.top - room.top) < room.height * 0.45;   // 상단이면 아래로, 아니면 위로

    bubble.dataset.dir = down ? 'down' : 'up';
    let top = down ? (a.bottom - room.top + 16) : (a.top - room.top - bh - 16);
    // 좌측 칸은 오른쪽으로, 우측 칸은 왼쪽으로 치우쳐 펼친다
    let left = anchorMidX < room.width/2 ? anchorMidX - bw*0.25 : anchorMidX - bw*0.75;
    left = Math.max(8, Math.min(room.width - bw - 8, left));
    top  = Math.max(8, Math.min(room.height - bh - 8, top));

    bubble.style.left = left + 'px';
    bubble.style.top  = top + 'px';
    const tail = bubble.querySelector('.bubble-tail');
    tail.style.left = Math.max(12, Math.min(bw - 32, anchorMidX - left - 10)) + 'px';
  }

  $('bubbleClose').addEventListener('click', closeBubble);

  /* ---------------------------------------------------------
     말풍선 띄우기 — 에이전트가 한 줄로 말한다
  --------------------------------------------------------- */
  function raiseSpeech(key, out){
    const b = booths[key];
    const label = GON.AGENT_LABEL[key];

    if(out.is_muted){
      // 할 말이 없으면 아예 입을 열지 않는다. 어두운 부스로 충분하다 (design.md §5.1)
      b.el.dataset.state = 'muted';
      b.status.textContent = out.placard;
      b.signal.dataset.sign = 'off';
      return;
    }

    const s = out.axis_score;
    // axis_score는 사이드 감점(§5.2)으로 소수가 올 수 있다 — 테두리 굵기 단계는
    // 0/1/2로 반올림해서 쓰고, 부호는 소수 그대로 본다
    const mag = Math.round(Math.abs(s));
    const sign = s > 0.001 ? 'pos' : (s < -0.001 ? 'neg' : 'neu');

    b.line.textContent = out.placard;
    b.speech.dataset.sign = sign;
    // 확신의 세기는 테두리 굵기로 말한다 (design.md §5.2)
    b.speech.dataset.strength = String(mag);
    // 12자 초과 방어 — 말줄임보다 한 단계 축소가 먼저 (design.md §7.3)
    b.speech.classList.toggle('long', Array.from(out.placard).length > 12);
    b.speech.hidden = false;

    b.note.hidden = !out.uncertain;
    // 점수는 이제 신호등 색으로 말한다 (초록=+, 주황=0, 빨강=-). 숫자는 접는다
    b.signal.dataset.sign = sign;
    b.status.textContent = out.defer ? '판단 유보' : '';
    b.el.dataset.state = 'done';

    b.speech.onclick = () => openBubble(key, label, out.detail, null, b.speech);
  }

  /* ---------------------------------------------------------
     순차 등장 큐 — 실제 응답 순서를 쓰되 최소 1000ms 간격 (design.md §6.1)
  --------------------------------------------------------- */
  const queue = [];
  let pumping = false, lastAt = 0;

  function enqueue(key, out){
    queue.push({ key:key, out:out });
    pump();
  }
  function pump(){
    if(pumping || !queue.length) return;
    pumping = true;
    const wait = Math.max(0, 1000 - (performance.now() - lastAt));
    setTimeout(() => {
      const item = queue.shift();
      raiseSpeech(item.key, item.out);
      lastAt = performance.now();
      pumping = false;
      pump();
    }, wait);
  }

  /* ---------------------------------------------------------
     팀장 포즈 타임라인 (design.md §6.2)
  --------------------------------------------------------- */
  const leadBar = $('leadBar');
  let poseTimers = [], timeoutTimer = null, session = null;

  function startLeadTimeline(){
    leadBar.dataset.pose = 'work';
    leadBar.dataset.state = 'working';
    leadLamp.dataset.sign = 'off';
    poseTimers.push(setTimeout(() => { leadBar.dataset.pose = 'think'; }, 5000));
    armTimeout();
  }
  function armTimeout(){
    clearTimeout(timeoutTimer);
    timeoutTimer = setTimeout(showTimeout, 20000);
  }
  function clearLeadTimers(){
    poseTimers.forEach(clearTimeout); poseTimers = [];
    clearTimeout(timeoutTimer);
  }

  function showTimeout(){
    const right = $('leadRight');
    right.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'timeout-box';
    box.innerHTML = '<span>시간이 조금 걸리고 있어요</span>';

    const keep = document.createElement('button');
    keep.type = 'button'; keep.className = 'btn-dot'; keep.textContent = '계속 기다리기';
    keep.onclick = () => {
      right.innerHTML = '<span class="lead-waiting">의견을 모으는 중…</span>';
      armTimeout();
    };

    const retry = document.createElement('button');
    retry.type = 'button'; retry.className = 'btn-dot'; retry.textContent = '다시 시도';
    retry.onclick = () => start();

    box.appendChild(keep); box.appendChild(retry);
    right.appendChild(box);
  }

  function showVerdict(lead){
    clearLeadTimers();
    leadBar.dataset.pose = 'done';
    // 건물이 블록 위로 솟아오르고, 신호등은 판정 색을 그대로 받는다
    leadBar.dataset.state = 'done';
    leadLamp.dataset.sign = lead.verdict === 'NO_GO' ? 'neg' : 'pos';

    const right = $('leadRight');
    right.innerHTML = '';

    const word = document.createElement('button');
    word.type = 'button';
    word.className = 'verdict-word';
    word.dataset.verdict = lead.verdict;
    word.textContent = lead.verdict_label;
    right.appendChild(word);

    const line = document.createElement('div');
    line.style.display = 'flex';
    line.style.alignItems = 'center';
    line.style.gap = '8px';
    line.style.flexWrap = 'wrap';
    const hint = document.createElement('span');
    hint.className = 'verdict-hint';
    hint.textContent = '누르면 이유를 들려줘요';
    line.appendChild(hint);
    if(lead.alternative){
      const chip = document.createElement('span');
      chip.className = 'alt-chip';
      chip.textContent = lead.alternative === 'SHARING' ? '나눔 검토' : '취소 검토';
      line.appendChild(chip);
    }
    right.appendChild(line);

    const altText = lead.alternative === 'SHARING'
      ? '대안: 나눔 — 혜택은 챙기고 자리만 넘기는 쪽입니다.'
      : (lead.alternative === 'CANCEL' ? '대안: 취소 — 수수료만 부담하고 정리하는 쪽입니다.' : null);

    word.onclick = () => openBubble('LEAD', '팀장', lead.reasoning, altText, word);
  }

  /* ---------------------------------------------------------
     시작
  --------------------------------------------------------- */
  function start(){
    const my = session = {};
    closeBubble();
    clearLeadTimers();
    queue.length = 0; pumping = false; lastAt = 0;

    // 부스 초기화
    AGENTS.forEach(a => {
      const b = booths[a.key];
      b.el.dataset.state = 'working';
      b.speech.hidden = true;
      b.note.hidden = true;
      b.signal.dataset.sign = 'off';
      b.status.textContent = '작업 중';
    });
    // 비용은 시야를 기다리는 동안 대기 포즈다 (design.md §6.1)
    booths.COST.el.dataset.state = 'waiting';
    booths.COST.status.textContent = '시야를 기다리는 중';

    $('leadRight').innerHTML = '<span class="lead-waiting">의견을 모으는 중…</span>';
    startLeadTimeline();

    const run = GON.runConsult(bundle);

    Object.keys(run.agents).forEach(key => {
      run.agents[key].then(out => {
        if(session !== my) return;
        // 호출되지 않은 에이전트는 처음부터 앉은 상태로 둔다 (큐를 태우지 않는다)
        if(out.is_muted) raiseSpeech(key, out);
        else enqueue(key, out);
      });
    });

    run.agents.SIYA.then(() => {
      if(session !== my) return;
      if(booths.COST.el.dataset.state === 'waiting'){
        booths.COST.el.dataset.state = 'working';
        booths.COST.status.textContent = '작업 중';
      }
    });

    run.lead.then(lead => {
      if(session === my) showVerdict(lead);
      saveConsultationRecord(lead, run);
    });
  }

  /* ---------------------------------------------------------
     상담기록 저장 — 로그인된 상담이고, 데모가 아닐 때만 (PRD §10.1)
  --------------------------------------------------------- */
  let savedOnce = false;
  async function saveConsultationRecord(lead, run){
    if(savedOnce || bundle === GON.DEMO_BUNDLE) return;
    if(!window.GON_AUTH || !GON_AUTH.ready()) return;
    savedOnce = true;
    try{
      const sess = await GON_AUTH.adoptStashedSession();
      if(!sess) { savedOnce = false; return; }   // 로그인 안 된 상태 — 저장 스킵
      const axis = {};
      const outs = await Promise.all(Object.keys(run.agents).map(k => run.agents[k].then(o => [k, o])));
      outs.forEach(([k, o]) => { axis[k] = (o && !o.is_muted) ? o.axis_score : null; });
      const s = bundle.seat || {};
      const { error } = await GON_AUTH.saveConsultation({
        work_title: bundle.season && bundle.season.work_title || null,
        season_id: bundle.season && bundle.season.id || null,
        season_label: bundle.season && bundle.season.season_label || null,
        seat: {
          floor: s.floor, block: s.block, row: s.row, number: s.number,
          grade: s.grade, is_restricted: s.is_restricted, side_zone: s.side_zone
        },
        paid: (bundle.payment && bundle.payment.total_paid != null) ? bundle.payment.total_paid : null,
        verdict: lead.verdict,
        axis_scores: axis,
        session_date: bundle.session && bundle.session.date || null
      });
      if(error) console.warn('[GON] 상담기록 저장 실패:', error.message);
    }catch(e){
      console.warn('[GON] 상담기록 저장 예외:', e);
    }
  }

  $('backBtn').addEventListener('click', () => { location.href = 'index.html'; });
  window.addEventListener('resize', () => { closeBubble(); layoutTails(); });

  start();
})();
</script>
</body>
</html>
