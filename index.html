<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>이 회차 갈까말까</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E">

<!-- 픽셀 도트체(Galmuri) + 본문 서체(Pretendard). 상업 이용 가능(SIL OFL 1.1).
     프로덕션에서는 design.md §10.1 권고대로 self-host 할 것. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri@2/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">

<!-- 컬러 토큰·리셋은 상담실(consult.html)과 공유한다 -->
<link rel="stylesheet" href="tokens.css">

<style>
/* ============================================================
   무대 배경 — 상담실(consult.html)의 백스테이지 골목 배경과 맞춘다.
   공연 전, 조명 트러스만 부분적으로 켜진 무대 뒤편: 어두운 세로 그라디언트
   위에 위쪽 3색(파랑·장미·호박) 조명 웅덩이와 바닥 반사 웅덩이를 얹는다.
   도트 폰트·랜딩 카드(.landing) 디자인은 그대로 두고 배경만 바꾼 것이다.
   ============================================================ */
:root{
  --sky-top: #0F0D0F;
  --sky-mid: #241A1D;
  --sky-low: #3A2620;
  --gel-amber: rgba(255,176,96,.5);
  --gel-blue:  rgba(120,172,255,.38);
  --gel-rose:  rgba(230,120,175,.36);
}
.stage{
  min-height:100vh;
  display:flex;
  align-items:stretch;
  justify-content:center;
  background:
    radial-gradient(24% 55% at 18% 3%,  var(--gel-blue),  transparent 74%),
    radial-gradient(20% 46% at 50% 2%,  var(--gel-rose),  transparent 74%),
    radial-gradient(26% 58% at 82% 4%,  var(--gel-amber), transparent 74%),
    radial-gradient(34% 20% at 18% 96%, rgba(120,172,255,.16), transparent 72%),
    radial-gradient(28% 16% at 50% 97%, rgba(230,120,175,.12), transparent 72%),
    radial-gradient(36% 20% at 82% 96%, rgba(255,176,96,.18), transparent 72%),
    radial-gradient(ellipse 60% 22% at 50% 100%, rgba(255,205,150,.13), transparent 72%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
  padding:clamp(12px, 3vw, 32px);
}

/* 회색 밑바탕은 왼쪽 질문지 패널에만 둔다. 카드 전체에 깔면 무대 배경이
   거의 안 보였다 — .landing 자체는 투명하게 두고 오른쪽은 배경이 비치게 한다. */
.landing{
  width:100%;
  max-width:1280px;
  display:grid;
  grid-template-columns: minmax(320px, 46%) 1fr;
  background:transparent;
  min-height: min(760px, 92vh);
  position:relative;
}

/* ============================================================
   왼쪽 — 로그인 + 사전질문 폼
   ============================================================ */
.panel-left{
  background:var(--bg);
  display:flex;
  flex-direction:column;
  padding: 18px 22px 22px;
  /* 카드 프레임(테두리·인셋·바닥 그림자)을 이 패널이 넘겨받는다 — 예전엔
     .landing 전체에 있었다 */
  border:2px solid var(--bg-dark);
  box-shadow:0 0 0 4px var(--bg-light) inset, 0 12px 0 var(--bg-dark);
  min-height:0;
}

.top-bar{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  min-height:34px;
}

.btn-dot{
  font-family:var(--dot);
  font-size:11px;
  letter-spacing:0.5px;
  background:var(--placard-bg);
  color:#3A2E1E;
  border:2px solid var(--placard-bd);
  padding:7px 12px;
  box-shadow:2px 2px 0 var(--bg-dark);
  transition:transform .12s ease, box-shadow .12s ease, filter .2s;
}
.btn-dot:hover:not(:disabled){ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--bg-dark); }
.btn-dot:active:not(:disabled){ transform:translate(1px,1px); box-shadow:0 0 0 var(--bg-dark); }
.btn-dot:disabled{ filter:grayscale(0.6) brightness(0.6); box-shadow:none; }

.user-chip{
  font-size:12px;
  color:var(--text-sub);
}

/* 로그인 전: 폼을 숨기지 않고 어둡게. opacity 대신 밝기/채도로 처리. */
.consult-form{
  filter: brightness(0.55) saturate(0.35);
  pointer-events:none;
  transition: filter 400ms ease-out;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-y:auto;
  padding-right:4px;
  flex:1;
}
.consult-form.is-lit{
  filter: brightness(1) saturate(1);
  pointer-events:auto;
}
.consult-form::-webkit-scrollbar{ width:8px; }
.consult-form::-webkit-scrollbar-thumb{ background:var(--bg-light); border-radius:0; }
.consult-form::-webkit-scrollbar-track{ background:var(--bg-dark); }

.row{
  display:flex;
  gap:8px;
  align-items:flex-end;
  flex-wrap:wrap;
}
.row.split > .field{ flex:1 1 45%; min-width:120px; }

.field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.field.narrow{ flex:0 0 64px; }
.field.mid{ flex:0 0 88px; }

label.field-label{
  font-size:12px;
  color:var(--text-sub);
}
label.field-label .req{ color:var(--accent); margin-left:2px; }

input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea{
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  color:var(--text);
  padding:7px 8px;
  font-size:15px;
  width:100%;
  outline:none;
  border-radius:2px;
}
input[type="number"]{ font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
input::placeholder, textarea::placeholder{ color:var(--text-dis); }

/* 세그먼트 토글 */
.segment{
  display:flex;
  border:1px solid var(--bg-light);
  border-radius:2px;
  overflow:hidden;
}
.segment button{
  flex:1;
  background:var(--bg-dark);
  color:var(--text-sub);
  border:none;
  padding:7px 6px;
  font-size:13px;
  border-right:1px solid var(--bg-light);
  transition:background .15s, color .15s;
}
.segment button:last-child{ border-right:none; }
.segment button.active{ background:var(--accent); color:#2A2100; font-weight:600; }
.segment button:hover:not(.active){ background:var(--bg-light); color:var(--text); }

/* 티켓값 */
.ticket-extra{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
}
.ticket-extra.open{ max-height:72px; margin-top:6px; }

/* 계산 결과 — 사실만 적고 판정하지 않는다 (changelog v2.1 §1.7).
   "최대 할인 받으셨어요!" 같은 판정은 비용 에이전트가 푯말로 할 말이다. */
.fact-line{
  margin:6px 0 0;
  font-size:12px;
  line-height:1.5;
  color:var(--text-sub);
  font-variant-numeric:tabular-nums;
}
.fact-line .warn{ color:var(--accent); }

/* 선호좌석 6칸 그리드 */
.pref-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
}
.pref-item{
  position:relative;
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  padding:6px 4px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--text-sub);
  font-size:11px;
  text-align:center;
  transition:border-color .15s, background .15s;
}
.pref-item:hover{ border-color:var(--light-dim); }
.pref-item.rank1{ border-color:var(--accent); background:#3f341c; color:var(--text); }
.pref-item.rank2{ border-color:var(--light-dim); background:#3a3626; color:var(--text); }
.pref-badge{
  position:absolute;
  top:-6px; left:-6px;
  width:16px; height:16px;
  background:var(--accent);
  color:#2A2100;
  font-family:var(--dot);
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--bg-dark);
}
.pref-icon{
  width:34px; height:34px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:1px;
  background:var(--bg);
  padding:2px;
}
.pref-icon i{ background:transparent; }
/* 노란색(accent) 한 가지만 쓰고, 역할은 불투명도로만 구분한다 */
.pref-icon i.cS{ background:var(--accent); opacity:.35; }   /* 무대 기준선 */
.pref-icon i.cA{ background:var(--accent); opacity:.6; }    /* 통로 라인 */
.pref-icon i.cM{ background:var(--accent); opacity:1; }     /* 좌석 표시 */

/* 처분 옵션 체크박스 */
.checks{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.chk{
  display:flex;
  align-items:center;
  gap:5px;
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  padding:5px 8px;
  font-size:12px;
  color:var(--text-sub);
  transition:border-color .15s, color .15s;
}
.chk input{ accent-color:var(--accent); width:13px; height:13px; margin:0; }
.chk.checked{ border-color:var(--accent); color:var(--text); }

/* 기타란 */
.freetext-toggle{
  background:none;
  border:none;
  color:var(--text-sub);
  font-size:12px;
  text-align:left;
  padding:6px 0;
  display:flex;
  align-items:center;
  gap:6px;
}
.freetext-toggle:hover{ color:var(--text); }
.freetext-toggle .arrow{ transition:transform .2s; display:inline-block; }
.freetext-toggle.open .arrow{ transform:rotate(90deg); }
.freetext-wrap{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
}
.freetext-wrap.open{ max-height:120px; }
textarea{ resize:none; height:78px; font-size:14px; line-height:1.5; }

.event-toggle-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
}
.event-toggle-row .field-label{ margin:0; }

/* CTA */
.cta-row{
  margin-top:14px;
  display:flex;
  justify-content:flex-end;
}
.btn-start{
  font-family:var(--dot14);
  font-size:15px;
  letter-spacing:1px;
  padding:12px 26px;
  background:var(--light-dim);
  color:var(--bg-dark);
  border:2px solid var(--placard-bd);
  box-shadow:3px 3px 0 var(--bg-dark);
  transition: all .2s;
}
.btn-start:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
.btn-start.ready{
  background:var(--accent);
  color:#2A2100;
  box-shadow:0 0 0 3px rgba(229,169,60,.25), 3px 3px 0 var(--bg-dark);
  animation: readyPulse 1.6s ease-in-out infinite;
}
@keyframes readyPulse{
  0%,100%{ filter:brightness(1); }
  50%{ filter:brightness(1.18); }
}
.btn-start.ready:hover{ transform:translate(-1px,-1px); }

/* ============================================================
   이벤트 2단계 화면 (조건부)
   ============================================================ */
.event-screen{
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
  overflow-y:auto;
  padding-right:4px;
}
.event-screen h2{
  font-family:var(--dot14);
  font-size:15px;
  color:var(--accent);
  margin:2px 0 0;
}
.event-screen .hint{ font-size:12px; color:var(--text-sub); margin:0 0 4px; }
.back-link{
  background:none; border:none; color:var(--text-sub);
  font-size:12px; padding:2px 0; align-self:flex-start;
}
.back-link:hover{ color:var(--text); }

.pill-group{ display:flex; flex-wrap:wrap; gap:6px; }
.pill{
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  color:var(--text-sub);
  font-size:12px;
  padding:6px 10px;
}
.pill.active{ border-color:var(--accent); color:var(--text); background:#3f341c; }
#discountBtns .pill{ cursor:pointer; }
.disc-meta{ font-size:11px; font-weight:400; color:var(--text-dis); margin-left:6px; }
.disc-meta.warn{ color:var(--accent); }

.scale-group{ display:flex; gap:6px; flex-wrap:wrap; }
.scale-btn{
  flex:1 1 auto;
  min-width:60px;
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  color:var(--text-sub);
  font-size:12px;
  padding:8px 4px;
  text-align:center;
}
.scale-btn.active{ background:var(--accent); color:#2A2100; border-color:var(--accent); font-weight:600; }

.detail-block{
  display:none;
  flex-direction:column;
  gap:6px;
  background:var(--bg-dark);
  border:1px solid var(--bg-light);
  padding:10px;
}
.detail-block.show{ display:flex; }

/* ============================================================
   오른쪽 — 타이틀 / 설명 / 좌석 스포트라이트
   ============================================================ */
.panel-right{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding: 40px 44px;
  /* 회색 밑바탕 없음 — 무대 배경(.stage 그라디언트)이 그대로 비친다.
     따뜻한 라디얼 한 겹만 남겨 제목 쪽에 옅은 스포트라이트를 준다 */
  background:
    radial-gradient(ellipse 78% 58% at 68% 16%, rgba(255,214,160,0.10), transparent 72%);
  overflow:hidden;
}

/* 제목은 도트체를 벗고 본문 서체의 굵은 획으로 간다 — 무대 조명 그라디언트
   위에 올라가므로, 따뜻한 크림→호박 그라디언트를 글자에 클립해 스포트라이트
   받은 사인보드처럼 보이게 한다 (텍스트가 transparent라 그림자는 filter로). */
.title{
  font-family:var(--sans);
  font-weight:800;
  font-size:clamp(34px, 5.2vw, 54px);
  line-height:1.12;
  letter-spacing:-0.022em;
  margin:0 0 18px;
  background:linear-gradient(163deg, #FCF1DA 12%, #F1C471 62%, #E09A31 100%);
  -webkit-background-clip:text;
          background-clip:text;
  color:transparent;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));
}

.subtitle{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  color:var(--text-sub);
  margin:0 0 48px;
}

.seat-stage{
  position:relative;
  height:150px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;         /* 뷰포트가 좁아 의자 줄이 넘칠 때 잘라낸다 */
}

/* 실제 뮤지컬 좌석 사진(chair.png) 위에서 쏘는 핀 조명 — 좌석이 사각 실루엣
   에서 세로로 긴 사진으로 바뀌면서, 초점도 위쪽 한 점보다 등받이 상단
   전체를 넓게 덮도록 타원을 낮고 넓게 늘렸다. 진행도에 따라 --spot-w·
   --spot-a가 커지는 건 그대로라 "점점 환해지는" 연출은 그대로 유지된다. */
.spotlight{
  position:absolute;
  inset:0;
  pointer-events:none;
  background: radial-gradient(ellipse var(--spot-w, 70px) 130px at 50% 6%,
              rgba(255,221,170, var(--spot-a, .16)) 0%,
              rgba(255,221,170, calc(var(--spot-a, .16) * .4)) 46%,
              transparent 76%);
  mix-blend-mode: screen;
  transition: background 350ms ease-out;
}

.seat-row{
  position:relative;
  z-index:1;
  display:flex;
  align-items:flex-end;
  gap:clamp(1px, 0.8vw, 6px);
  filter: brightness(var(--seat-b, 0.42)) saturate(var(--seat-s, 0.55));
  transition: filter 350ms ease-out;
}

/* 좌석 한 칸 = chair.png 한 장. 사진이라 tokens.css의 전역 pixelated
   규칙을 여기서만 풀고, 바닥에 앉은 느낌을 주는 그림자를 얹는다 */
.seat{
  height:clamp(58px, 9.5vw, 96px);
  width:auto;
  flex:0 0 auto;
  image-rendering:auto;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.5));
}

.progress-note{
  position:absolute;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:var(--text-dis);
  letter-spacing:1px;
  z-index:2;
}

/* ============================================================
   전환 오버레이
   ============================================================ */
.transition-overlay{
  position:fixed; inset:0;
  background:var(--light);
  opacity:0;
  pointer-events:none;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .5s ease;
}
.transition-overlay.show{ opacity:1; pointer-events:auto; }
.transition-overlay span{
  font-family:var(--dot14);
  font-size:20px;
  color:#2A2100;
}

/* 관리자 진입 — 우하단에 아주 옅게. 클릭하면 관리자 도구(비밀번호)로 이동 */
.admin-dot{
  position:fixed;
  right:6px; bottom:4px;
  font-size:13px;
  line-height:1;
  padding:8px;
  opacity:.16;
  text-decoration:none;
  color:var(--text-sub);
  z-index:30;
  transition:opacity .2s;
}
.admin-dot:hover, .admin-dot:focus-visible{ opacity:.75; }

/* ============================================================
   모달 — 이용내역
   ============================================================ */
.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center;
  z-index:40;
}
.modal{
  width:min(420px, 90vw);
  background:var(--bg);
  border:2px solid var(--placard-bd);
  box-shadow:6px 6px 0 var(--bg-dark);
  padding:20px;
}
.auth-error{
  margin:10px 0 0; padding:8px 10px;
  background:rgba(196,103,79,.16); color:var(--neg);
  font-size:13px; border:1px solid var(--neg);
}
.auth-actions{ display:flex; gap:8px; align-items:center; margin-top:14px; }
.auth-actions .btn-start{ flex:1; }
#historyBody .hist-row{
  display:grid; grid-template-columns:1fr auto; gap:2px 10px;
  padding:10px 0; border-top:1px solid var(--placard-bd);
}
#historyBody .hist-row:first-child{ border-top:none; }
#historyBody .hist-title{ font-weight:700; }
#historyBody .hist-verdict{ font-family:var(--dot); font-size:13px; }
#historyBody .hist-verdict.go{ color:var(--pos); }
#historyBody .hist-verdict.nogo{ color:var(--neg); }
#historyBody .hist-meta{ font-size:12px; color:var(--text-sub); grid-column:1/-1; }
.modal h3{
  font-family:var(--dot14);
  font-size:16px;
  color:var(--accent);
  margin:0 0 12px;
}
.modal p{
  font-size:14px;
  color:var(--text-sub);
  line-height:1.6;
  margin:0 0 16px;
}
.modal .modal-close{ float:right; }

/* ---- 사후 피드백 모달 (PRD §3.6 · §10.1) ---- */
#feedbackBackdrop .fb-context{
  font-size:12px;
  color:var(--text-sub);
  line-height:1.5;
  margin:0 0 14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--placard-bd);
}
#feedbackBackdrop .fb-step{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
}
#feedbackBackdrop .fb-step[hidden]{ display:none; }

/* ============================================================
   반응형 — design.md §8
   ============================================================ */
@media (max-width: 1023px){
  .landing{ grid-template-columns: 1fr; min-height:auto; gap:14px; }
  .panel-right{
    order:-1;
    padding:24px 20px 8px;
  }
  .subtitle{ margin-bottom:24px; }
  .seat-stage{ height:100px; }
  .panel-left{ padding:16px 18px 20px; }
}

@media (max-width: 640px){
  .title{ font-size:30px; }
  .row.split{ flex-direction:column; }
  .pref-grid{ grid-template-columns:repeat(2,1fr); }
  .stage{ padding:0; }
  .panel-left{ border-width:0; box-shadow:none; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="landing">

    <!-- ===================== 왼쪽 패널 ===================== -->
    <section class="panel-left">

      <div class="top-bar">
        <button id="loginBtn" class="btn-dot">로그인</button>
        <button id="historyBtn" class="btn-dot" hidden>이용내역</button>
        <span class="user-chip" id="userChip" hidden></span>
      </div>

      <!-- ---- 사전질문 폼 (필수 9항목 + 조건부 이벤트 유무 + 기타란) ---- -->
      <form id="consultForm" class="consult-form" novalidate>

        <!-- R-1 공연 제목 -->
        <div class="row">
          <div class="field">
            <label class="field-label" for="workTitle">공연 제목<span class="req">*</span></label>
            <input list="workList" id="workTitle" type="text" placeholder="작품명을 검색하세요" autocomplete="off">
            <datalist id="workList">
              <option value="웨스턴 스토리">
              <option value="해몽가">
              <option value="알라딘">
              <option value="엘리자벳">
              <option value="라흐마니노프">
            </datalist>
          </div>
        </div>

        <!-- R-2 관람 일시·회차 -->
        <div class="row">
          <div class="field">
            <label class="field-label" for="sessionDate">관람 일시<span class="req">*</span></label>
            <input id="sessionDate" type="date">
          </div>
          <div class="field mid">
            <label class="field-label">회차</label>
            <div class="segment" data-group="matinee">
              <button type="button" data-value="MATINEE">낮공</button>
              <button type="button" data-value="EVENING">밤공</button>
            </div>
          </div>
        </div>

        <!-- R-3 좌석 위치 -->
        <div class="row">
          <div class="field narrow">
            <label class="field-label" for="seatFloor">층<span class="req">*</span></label>
            <select id="seatFloor">
              <option value="">-</option>
              <option value="1">1층</option>
              <option value="2">2층</option>
              <option value="3">3층</option>
            </select>
          </div>
          <div class="field mid">
            <label class="field-label" for="seatBlock">블럭</label>
            <input id="seatBlock" type="text" placeholder="편하게 부르는 이름">
          </div>
          <div class="field mid">
            <label class="field-label" for="seatRowInput">열<span class="req">*</span></label>
            <input id="seatRowInput" type="text" placeholder="6">
          </div>
          <div class="field mid">
            <label class="field-label" for="seatNumber">번<span class="req">*</span></label>
            <input id="seatNumber" type="number" placeholder="7">
          </div>
        </div>

        <!-- R-4 티켓값 — changelog v2.1 §1.5
             직접/양도 분기는 없앴다. 직접 예매한 표를 남에게 양도할 때도
             권종 증빙 문제가 생기므로 "내 표"라고 답한 사용자에게 증빙
             질문이 안 뜨는 게 오히려 틀렸다. -->
        <div class="row">
          <div class="field">
            <label class="field-label">어떤 할인을 받으셨나요?<span class="req">*</span><span class="disc-meta" id="discountMeta"></span></label>
            <div class="pill-group" id="discountBtns"></div>
          </div>
          <div class="field mid">
            <label class="field-label" for="paidAmount">결제한 금액(원)<span class="req">*</span></label>
            <input id="paidAmount" type="number" min="0" step="100" placeholder="46500">
          </div>
        </div>
        <!-- 증빙 3택 — ELIGIBILITY·LOYALTY 권종이나 "목록에 없는 할인"일 때만 -->
        <div class="ticket-extra" id="proofExtra">
          <div class="field">
            <label class="field-label">증빙 가능하신가요?<span class="req">*</span></label>
            <div class="segment" data-group="proofStatus">
              <button type="button" data-value="NOT_REQUIRED">필요 없어요</button>
              <button type="button" data-value="AVAILABLE">가능해요</button>
              <button type="button" data-value="UNAVAILABLE">불가해요</button>
            </div>
          </div>
        </div>
        <!-- 대체 권종 — 증빙 불가 + GRADE_CHANGE 정책일 때만 -->
        <div class="ticket-extra" id="altGradeExtra">
          <div class="field">
            <label class="field-label" for="altGradeSelect">어떤 권종으로 바꾸시겠어요?</label>
            <select id="altGradeSelect"></select>
          </div>
        </div>
        <p class="fact-line" id="priceFactLine" hidden></p>

        <!-- R-5 오늘 캐스팅 -->
        <div class="row">
          <div class="field">
            <label class="field-label">오늘 캐스팅에 본진·애배 출연?<span class="req">*</span></label>
            <div class="segment" data-group="casting">
              <button type="button" data-value="YES">출연함</button>
              <button type="button" data-value="NO">출연 안 함</button>
            </div>
          </div>
        </div>

        <!-- R-6 자첫 여부 / R-8 오글 의향 -->
        <div class="row split">
          <div class="field">
            <label class="field-label">이 작품 처음 보시나요?<span class="req">*</span></label>
            <div class="segment" data-group="firstWatch">
              <button type="button" data-value="YES">자첫</button>
              <button type="button" data-value="NO">봤음</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label">오늘 오페라글라스 쓰실 생각인가요?<span class="req">*</span></label>
            <div class="segment" data-group="operaGlass">
              <button type="button" data-value="YES">쓸 예정</button>
              <button type="button" data-value="NO">안 씀</button>
            </div>
          </div>
        </div>

        <!-- R-6b 작품 선호도 (자첫이 아닐 때만) -->
        <div class="ticket-extra" id="workAffinityExtra">
          <div class="field">
            <label class="field-label">이 작품, 나한테는 어떤가요?<span class="req">*</span></label>
            <div class="segment" data-group="workAffinity">
              <button type="button" data-value="LOVE">인생작</button>
              <button type="button" data-value="LIKE">좋아함</button>
              <button type="button" data-value="MEH">무난</button>
              <button type="button" data-value="DISLIKE">안 맞음</button>
            </div>
          </div>
        </div>

        <!-- R-7 선호 좌석 1·2순위 -->
        <div class="row">
          <div class="field">
            <label class="field-label">선호 좌석 1·2순위 (순서대로 탭)<span class="req">*</span></label>
            <div class="pref-grid" id="prefGrid"></div>
          </div>
        </div>
        <div class="ticket-extra" id="actorPathExtra">
          <div class="field">
            <label class="field-label">애배 동선은 어느 쪽인가요?</label>
            <div class="segment" data-group="actorPathSide">
              <button type="button" data-value="LEFT">왼</button>
              <button type="button" data-value="CENTER">중</button>
              <button type="button" data-value="RIGHT">오</button>
            </div>
          </div>
        </div>

        <!-- R-9 처분 가능 옵션 -->
        <div class="row">
          <div class="field">
            <label class="field-label">안 가기로 하면 뭘 할 수 있나요? (복수 선택)<span class="req">*</span></label>
            <div class="checks" id="disposalChecks">
              <label class="chk"><input type="checkbox" value="NO_TRANSFER"><span>양도 안 나갈 듯</span></label>
              <label class="chk"><input type="checkbox" value="SELF_DISCOUNT"><span>자할해야 양도</span></label>
              <label class="chk"><input type="checkbox" value="TRANSFERABLE"><span>양도 가능</span></label>
              <label class="chk"><input type="checkbox" value="NEEDS_PROOF"><span>증빙 도움 필요</span></label>
              <label class="chk"><input type="checkbox" value="SHARING"><span>나눔 가능</span></label>
              <!-- 취소 권한은 원 예매자 계정에만 있다. 취득 경로를 안 묻게 됐으니
                   사용자가 더 잘 아는 것을 직접 받는다 (PRD 원칙 5) -->
              <label class="chk"><input type="checkbox" value="NO_CANCEL"><span>취소 불가(내 계정 아님)</span></label>
            </div>
          </div>
        </div>

        <!-- 이벤트 유무 (조건부 분기 트리거) -->
        <div class="row">
          <div class="field">
            <div class="event-toggle-row">
              <label class="field-label" style="margin:0;">오늘 이벤트가 있나요?</label>
              <div class="segment" data-group="eventExists" style="flex:0 0 140px;">
                <button type="button" data-value="NO" class="active">없음</button>
                <button type="button" data-value="YES">있음</button>
              </div>
            </div>
          </div>
        </div>

        <!-- S-1 기타란 — changelog v2.1 §2.3
             기본을 펼침으로 두고 "(선택)"을 뺐다. 앞 항목을 다 채우면
             "더 없다"는 심리가 생겨 넘어가는데, 케이스 스터디 6건 중
             결론을 뒤집은 게 2건(CASE 5 거부권, CASE 6 나눔) 나온 칸이다. -->
        <div class="row">
          <div class="field">
            <button type="button" class="freetext-toggle open" id="freetextToggle">
              <span class="arrow">▸</span> 이 회차만의 사정이 있나요?
            </button>
            <div class="freetext-wrap open" id="freetextWrap">
              <textarea id="freeText" placeholder="컨디션, 전날·당일·다음날 일정, 막차 시간, 부대비용(KTX·숙소·촬영 장비 등), 페어막·첫공·막공 등 앞에서 못 담은 이야기를 적어주세요"></textarea>
            </div>
          </div>
        </div>

      </form>

      <!-- ---- 이벤트 2단계 화면 (조건부, "이벤트 있음"일 때만) ---- -->
      <div class="event-screen" id="eventScreen" hidden>
        <button type="button" class="back-link" id="eventBack">← 사전질문으로 돌아가기</button>
        <h2>오늘 이벤트</h2>
        <p class="hint">종류를 고르고, 얼마나 끌리는지 · 다시 만날 수 있는지 알려주세요.</p>

        <div class="field">
          <label class="field-label">종류 (복수 선택)</label>
          <div class="pill-group" id="eventTypePills">
            <button type="button" class="pill" data-value="GIFT">증정</button>
            <button type="button" class="pill" data-value="POINT">적립 혜택</button>
            <button type="button" class="pill" data-value="PHOTO">커튼콜 데이</button>
            <button type="button" class="pill" data-value="SPECIAL_CC">스페셜 커튼콜/장면 시연</button>
            <button type="button" class="pill" data-value="LUCKY">럭키드로우</button>
            <button type="button" class="pill" data-value="GREETING">무대인사</button>
            <button type="button" class="pill" data-value="SIGN">사인회</button>
            <button type="button" class="pill" data-value="GV">관객과의 대화(GV)</button>
          </div>
          <input type="text" id="eventCustom" placeholder="직접 입력 (선택)" style="margin-top:6px;">
        </div>

        <div class="detail-block" id="giftDetail">
          <label class="field-label" for="giftItem">증정 품목</label>
          <input id="giftItem" type="text" placeholder="예: 폴라로이드">
          <label class="field-label" style="margin-top:4px;">배부 방식</label>
          <div class="segment" data-group="giftDistribution">
            <button type="button" data-value="ALL">전원 증정</button>
            <button type="button" data-value="PICK">전원 지정</button>
            <button type="button" data-value="RANDOM">전원 랜덤</button>
          </div>
        </div>

        <div class="detail-block" id="pointDetail">
          <label class="field-label">적립 배수</label>
          <div class="segment" data-group="pointMultiplier">
            <button type="button" data-value="DOUBLE">더블</button>
            <button type="button" data-value="TRIPLE">트리플</button>
            <button type="button" data-value="QUAD">쿼드</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label">얼마나 끌리세요?</label>
          <div class="scale-group" id="appealScale">
            <button type="button" class="scale-btn" data-value="0">쓸모없음</button>
            <button type="button" class="scale-btn" data-value="1">별로</button>
            <button type="button" class="scale-btn" data-value="2">보통</button>
            <button type="button" class="scale-btn" data-value="3">끌림</button>
            <button type="button" class="scale-btn" data-value="4">가고싶음</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label">오늘 못 가면 다시 만날 기회가 있나요?</label>
          <div class="scale-group" id="scarcityScale">
            <button type="button" class="scale-btn" data-value="MANY">많다</button>
            <button type="button" class="scale-btn" data-value="FEW">적다</button>
            <button type="button" class="scale-btn" data-value="NONE">없다</button>
            <button type="button" class="scale-btn" data-value="UNKNOWN">모르겠음</button>
          </div>
        </div>
      </div>

      <div class="cta-row">
        <button type="button" class="btn-start" id="startBtn" disabled>상담 시작</button>
      </div>
    </section>

    <!-- ===================== 오른쪽 패널 ===================== -->
    <section class="panel-right">
      <h1 class="title">이 회차<br>갈까말까</h1>
      <p class="subtitle">다섯 명이 각자의 관점에서<br>이 회차를 판단합니다</p>

      <div class="seat-stage">
        <div class="spotlight" id="spotlight"></div>
        <div class="seat-row" id="seatRow"></div>
        <span class="progress-note" id="progressNote">0%</span>
      </div>
    </section>

  </div>
</div>

<div class="transition-overlay" id="transitionOverlay"><span>상담실로 들어갑니다…</span></div>

<a id="adminDot" class="admin-dot" title="관리자" aria-label="관리자 도구">⚙</a>

<div class="modal-backdrop" id="historyBackdrop" hidden>
  <div class="modal">
    <button type="button" class="btn-dot modal-close" id="historyClose">닫기</button>
    <h3>이용 내역</h3>
    <div id="historyBody"><p>불러오는 중…</p></div>
  </div>
</div>

<!-- 사후 피드백 모달 — 관람일이 지난 상담에 대해 다음 접속 때 한 번 묻는다 (PRD §3.6) -->
<div class="modal-backdrop" id="feedbackBackdrop" hidden>
  <div class="modal">
    <h3>이 회차, 어떻게 되셨어요?</h3>
    <p class="fb-context" id="fbContext"></p>

    <div class="fb-step" id="fbStepResult">
      <label class="field-label">실제로는?</label>
      <div class="segment" data-group="fbResult">
        <button type="button" data-value="WENT">갔음</button>
        <button type="button" data-value="GAVE">나눔</button>
        <button type="button" data-value="SKIP">안 감</button>
      </div>
    </div>

    <div class="fb-step" id="fbStepSeat" hidden>
      <label class="field-label">자리는 어떠셨어요?</label>
      <div class="scale-group" id="fbSeatScale">
        <button type="button" class="scale-btn" data-value="0">최악</button>
        <button type="button" class="scale-btn" data-value="1">별로</button>
        <button type="button" class="scale-btn" data-value="2">보통</button>
        <button type="button" class="scale-btn" data-value="3">좋음</button>
        <button type="button" class="scale-btn" data-value="4">최고</button>
      </div>
    </div>

    <div class="fb-step" id="fbStepGift" hidden>
      <label class="field-label">이벤트(증정)는 어떠셨어요?</label>
      <div class="scale-group" id="fbGiftScale">
        <button type="button" class="scale-btn" data-value="0">최악</button>
        <button type="button" class="scale-btn" data-value="1">별로</button>
        <button type="button" class="scale-btn" data-value="2">보통</button>
        <button type="button" class="scale-btn" data-value="3">좋음</button>
        <button type="button" class="scale-btn" data-value="4">최고</button>
      </div>
    </div>

    <div class="auth-actions">
      <button type="button" class="btn-start" id="fbSubmit" disabled>보내기</button>
      <button type="button" class="btn-dot" id="fbLater">나중에</button>
    </div>
  </div>
</div>

<!-- 로그인 게이트 — 로그인해야 상담을 시작할 수 있다. 닫으면 비활성 화면이 보인다 -->
<div class="modal-backdrop" id="authBackdrop" hidden>
  <div class="modal">
    <button type="button" class="btn-dot modal-close" id="authClose">닫기</button>
    <h3 id="authTitle">로그인</h3>
    <p id="authIntro">상담을 시작하려면 로그인하세요. 상담 내역이 저장되고, 관람 후 피드백을 받아 정확도가 올라갑니다.</p>
    <label class="field-label" for="authEmail">이메일</label>
    <input type="text" id="authEmail" autocomplete="username" inputmode="email">
    <label class="field-label" for="authPw" style="margin-top:8px">비밀번호</label>
    <input type="password" id="authPw" autocomplete="current-password">
    <div id="authError" class="auth-error" hidden></div>
    <div class="auth-actions">
      <button type="button" class="btn-start" id="authSubmit">로그인</button>
      <button type="button" class="btn-dot" id="authToggle">회원가입으로</button>
    </div>
  </div>
</div>

<!-- Supabase 클라이언트 (로그인 + 상담기록 저장). file:// 에서도 동작하려면 인터넷 필요. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/supabase-config.js"></script>

<!-- 1회성 수집 데이터 (PRD §9.2) — 상담 시점에는 크롤링하지 않고 조회만 한다 -->
<script src="data/seed.js"></script>
<!-- Supabase 오버레이 (있으면 seed.js 위에 덮음). 'npm run pull' 이 생성.
     아직 안 만들었으면 file:// 콘솔에 404 하나 뜰 뿐 동작엔 영향 없다. -->
<script src="data/seed.remote.js"></script>
<script src="data.js"></script>
<script src="data/auth.js"></script>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     상태
  --------------------------------------------------------- */
  const state = {
    loggedIn:false,
    matinee:null,
    // R-4 할인 사다리 (v2.1 §1.5)
    // 할인 버튼의 값: '' 미답 | 'NONE' 정가 | 'OTHER' 목록에 없음 | 권종명
    selectedDiscount:'',
    // 실제 고른 할인 객체 — 같은 이름이 등급별로 여러 개일 수 있어 이름만으론 부족하다
    selectedDiscountObj:null,
    proofStatus:null,      // NOT_REQUIRED | AVAILABLE | UNAVAILABLE
    altGradeName:null,     // 증빙 불가 + GRADE_CHANGE 일 때 고른 대체 권종
    casting:null,
    firstWatch:null,
    workAffinity:null,     // 자첫이 아닐 때만 받는다 (LOVE/LIKE/MEH/DISLIKE)
    operaGlass:null,
    eventExists:'NO',
    prefRank:[],           // ['FRONT','AISLE'] 순서 = 순위
    actorPathSide:null,    // ACTOR_PATH 선택 시에만 사용 (LEFT/CENTER/RIGHT)
    disposal:new Set(),
    eventTypes:new Set(),
    giftDistribution:null,
    pointMultiplier:null,
    appeal:null,
    scarcity:null,
    onEventScreen:false
  };

  // 아이콘 패턴 5x5. S=무대 기준선(흐리게) M=좌석 표시(진하게) A=통로 라인 0=빈칸
  // 흰색 없이 노란색 하나만 쓰고, 불투명도 차이로만 구분한다.
  const PREF_OPTIONS = [
    { key:'FRONT',       label:'무조건 앞', pattern:'SSSSS 00M00 00000 00000 00000' },
    { key:'CENTER',      label:'중블 사수', pattern:'SSSSS 00000 00M00 00000 00000' },
    { key:'WHOLE',       label:'한눈에',   pattern:'SSSSS 00000 00000 00000 00M00' },
    // 애배 동선: 한쪽으로 치우친 자리라는 느낌만 (왼/오는 선택 후 별도로 입력)
    { key:'ACTOR_PATH',  label:'애배 동선', pattern:'SSSSS 00000 0M000 00000 00000' },
    // 통로석: 좌우 양쪽에 통로가 있는 모양
    { key:'AISLE',       label:'통로석',   pattern:'SSSSS A000A A0M0A A000A A000A' },
    // 가성비: 무대 기준선 없이 붕 떠오르는 반짝임
    { key:'VALUE',       label:'가성비',   pattern:'00M00 0MMM0 MMMMM 0M0M0 M000M' }
  ];

  /* ---------------------------------------------------------
     유틸
  --------------------------------------------------------- */
  function $(id){ return document.getElementById(id); }
  function segBind(groupSelector, onPick){
    document.querySelectorAll('[data-group="'+groupSelector+'"] button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('[data-group="'+groupSelector+'"] button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        onPick(btn.dataset.value);
      });
    });
  }

  /* ---------------------------------------------------------
     선호 좌석 6칸 그리드 렌더 + 랭크 로직
  --------------------------------------------------------- */
  const prefGrid = $('prefGrid');
  PREF_OPTIONS.forEach(opt=>{
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'pref-item';
    item.dataset.key = opt.key;

    const icon = document.createElement('div');
    icon.className = 'pref-icon';
    opt.pattern.split(' ').join('').split('').forEach(ch=>{
      const cell = document.createElement('i');
      if(ch !== '0') cell.classList.add('c'+ch);
      icon.appendChild(cell);
    });
    item.appendChild(icon);

    const label = document.createElement('span');
    label.textContent = opt.label;
    item.appendChild(label);

    item.addEventListener('click', ()=>{
      const idx = state.prefRank.indexOf(opt.key);
      if(idx > -1){
        state.prefRank.splice(idx,1);
      } else {
        if(state.prefRank.length >= 2) state.prefRank.shift();
        state.prefRank.push(opt.key);
      }
      renderPrefRanks();
      const showActorPath = state.prefRank.includes('ACTOR_PATH');
      $('actorPathExtra').classList.toggle('open', showActorPath);
      if(!showActorPath){
        state.actorPathSide = null;
        document.querySelectorAll('[data-group="actorPathSide"] button').forEach(b=>b.classList.remove('active'));
      }
      updateProgress();
    });

    prefGrid.appendChild(item);
  });

  function renderPrefRanks(){
    prefGrid.querySelectorAll('.pref-item').forEach(el=>{
      el.classList.remove('rank1','rank2');
      const badge = el.querySelector('.pref-badge');
      if(badge) badge.remove();
      const rank = state.prefRank.indexOf(el.dataset.key);
      if(rank === 0){
        el.classList.add('rank1');
        addBadge(el,'1');
      } else if(rank === 1){
        el.classList.add('rank2');
        addBadge(el,'2');
      }
    });
  }
  function addBadge(el, num){
    const b = document.createElement('span');
    b.className = 'pref-badge';
    b.textContent = num;
    el.appendChild(b);
  }

  /* ---------------------------------------------------------
     처분 옵션 체크박스
  --------------------------------------------------------- */
  document.querySelectorAll('#disposalChecks .chk input').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(chk.checked) state.disposal.add(chk.value); else state.disposal.delete(chk.value);
      chk.closest('.chk').classList.toggle('checked', chk.checked);
      updateProgress();
    });
  });

  /* ---------------------------------------------------------
     R-4 할인 사다리 — changelog v2.1 §1.5 · §1.7

     할인율을 역산해 권종을 추정하는 방식은 폐기했다. 5% 할인이 두 개
     있거나 포인트·자체 쿠폰이 섞이면 추정이 깨진다. 사용자가 직접 고른다.

     전 과정이 결정론적이라 입력 즉시 계산된다. LLM 호출이 없다.
  --------------------------------------------------------- */
  function currentSeason(){
    return GON_DB.findSeason($('workTitle').value.trim(), $('sessionDate').value);
  }

  function currentList(){
    const season = currentSeason();
    if(!season) return null;
    const seatInfo = GON_DB.resolveSeat(season, {
      floor: $('seatFloor').value ? Number($('seatFloor').value) : null,
      row: $('seatRowInput').value.trim(),
      number: $('seatNumber').value ? Number($('seatNumber').value) : null
    });
    return GON_DB.listPrice(season, seatInfo.grade);
  }

  // 좌석등급으로 실제 등급 알아낸다 (미입력이면 null)
  function currentSeatGrade(){
    const l = currentList();
    return l ? l.grade : null;
  }

  // 할인 버튼은 이름 하나당 하나. 등급별로 할인율이 나뉜 건 좌석을 넣으면 알아서 고른다.
  function fillDiscountButtons(){
    const box = $('discountBtns');
    const season = currentSeason();
    const ds  = GON_DB.discounts(season) || [];
    const hasList = ds.length > 0;
    const prevName = state.selectedDiscount;
    box.innerHTML = '';

    // 이름으로 묶는다
    const groups = [];
    ds.forEach(d=>{
      let g = groups.find(x=> x.name === d.name);
      if(!g){ g = { name:d.name, items:[] }; groups.push(g); }
      g.items.push(d);
    });

    const opts = [{ v:'NONE', label:'정가' }];
    groups.forEach(g=>{
      const rs = g.items.map(d=> Number(d.rate));
      const mn = Math.min.apply(null, rs), mx = Math.max.apply(null, rs);
      const rate = (mn === mx) ? mn + '%' : mn + '~' + mx + '%';
      opts.push({ v:g.name, label: g.name.replace(/\s*할인$/,'') + ' ' + rate });
    });
    opts.push({ v:'OTHER', label: hasList ? '목록에 없는 할인' : '할인 받음' });

    const keep = opts.some(o=> o.v === prevName) ? prevName : '';
    state.selectedDiscount = keep;

    opts.forEach(o=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill';
      b.textContent = o.label;
      if(o.v === keep) b.classList.add('active');
      b.addEventListener('click', ()=>{
        state.selectedDiscount = o.v;
        box.querySelectorAll('.pill').forEach(x=> x.classList.toggle('active', x === b));
        resolveSelectedDiscount();
        syncTicketFields();
        updateProgress();
      });
      box.appendChild(b);
    });

    resolveSelectedDiscount();
    renderDiscountMeta(season, hasList);
  }

  // state.selectedDiscount(이름) + 내 좌석등급 → 실제 할인 객체를 고른다.
  // 같은 이름이 등급별로 여러 개면 등급에 맞는 것. 등급 모르면 첫 번째.
  function resolveSelectedDiscount(){
    const v = state.selectedDiscount;
    if(!v || v === 'NONE' || v === 'OTHER'){ state.selectedDiscountObj = null; return; }
    const named = (GON_DB.discounts(currentSeason()) || []).filter(d=> d.name === v);
    if(!named.length){ state.selectedDiscountObj = null; return; }
    if(named.length === 1){ state.selectedDiscountObj = named[0]; return; }
    const grade = currentSeatGrade();
    const hit = named.filter(d=>
      GON_DB.discountAppliesToGrade(d, grade) &&
      GON_DB.discountAppliesToSession(d, state.matinee));
    state.selectedDiscountObj = hit[0] || named[0];
  }

  // "어떤 할인을 받으셨나요?" 옆 작은 글씨 — 갱신일 또는 미수집 안내
  function renderDiscountMeta(season, hasList){
    const el = $('discountMeta');
    if(!season){ el.textContent = ''; el.className = 'disc-meta'; return; }
    if(!hasList){
      el.textContent = '· 아직 할인 정보가 업데이트되지 않았어요';
      el.className = 'disc-meta warn';
      return;
    }
    const iso = GON_DB.discountsUpdatedAt(season);
    if(iso){
      const d = new Date(iso);
      const ymd = d.getFullYear() + '.' +
        String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
      el.textContent = '· 할인정보 업데이트 ' + ymd;
    } else {
      el.textContent = '';
    }
    el.className = 'disc-meta';
  }

  function fillAltGradeSelect(){
    const sel = $('altGradeSelect');
    const ds  = GON_DB.discounts(currentSeason()) || [];
    const prev = state.altGradeName;
    sel.innerHTML = '';
    sel.appendChild(new Option('정가로 추가결제', ''));
    ds.filter(d=> d !== state.selectedDiscountObj)
      .forEach(d=> sel.appendChild(new Option(d.name + ' ' + d.rate + '%', d.name)));
    const keep = Array.from(sel.options).some(o=> o.value === prev) ? prev : '';
    sel.value = keep;
    state.altGradeName = keep || null;
  }

  // 증빙은 자격 권종·재관람 권종·목록 밖 할인일 때만 묻는다.
  // "권종 증빙"은 자격 증빙뿐 아니라 재관람 할인권·쿠폰팩 실물 소지까지 포괄한다.
  function needsProof(){
    const v = state.selectedDiscount;
    if(!v || v === 'NONE') return false;
    if(v === 'OTHER') return true;
    const d = state.selectedDiscountObj;
    return !!d && (d.type === 'ELIGIBILITY' || d.type === 'LOYALTY');
  }

  function buildPayment(){
    const season = currentSeason();
    return GON_DB.computePayment(season, currentList(), {
      paid: Number($('paidAmount').value) || 0,
      selected: state.selectedDiscount === 'OTHER' ? null : state.selectedDiscountObj,
      isOther: state.selectedDiscount === 'OTHER',
      firstWatch: state.firstWatch === 'YES',
      proofStatus: needsProof() ? state.proofStatus : null,
      altName: state.altGradeName,
      matinee: state.matinee            // 회차 제한 할인(마티네/밤공 전용) 필터
    });
  }

  // 화면에는 사실만 표시하고 판정하지 않는다 (§1.7).
  // "최대 할인 받으셨어요!" 같은 말은 비용 에이전트가 푯말로 할 말이고,
  // 여기서 미리 말하면 푯말의 가치가 사라진다.
  function renderFactLine(){
    const line = $('priceFactLine');
    const p = buildPayment();
    if(p.list_price == null || !p.total_paid){
      line.hidden = true;
      return;
    }

    const parts = [];
    parts.push((p.grade ? p.grade + '석 ' : '') + '정가 ' + won(p.list_price));
    if(p.discount_rate != null){
      parts.push(p.discount_rate > 0 ? p.discount_rate + '% 할인' : '할인 없음');
    }
    if(p.surcharge > 0){
      parts.push('추가결제 ' + won(p.surcharge));
      parts.push('실제 부담 ' + won(p.actual_burden));
    }

    line.textContent = parts.join(' · ');
    if(p.mismatch_warn){
      const w = document.createElement('span');
      w.className = 'warn';
      w.textContent = '  금액이나 할인 종류를 다시 확인해보세요';
      line.appendChild(w);
    }
    line.hidden = false;
  }

  function won(n){ return Number(n).toLocaleString('ko-KR') + '원'; }

  // 할인 사다리에 걸린 화면 상태를 한 번에 맞춘다
  function syncTicketFields(){
    const ask = needsProof();
    $('proofExtra').classList.toggle('open', ask);
    if(!ask){
      state.proofStatus = null;
      document.querySelectorAll('[data-group="proofStatus"] button').forEach(b=>b.classList.remove('active'));
    }

    // 대체 권종은 증빙 불가 + GRADE_CHANGE 정책일 때만 의미가 있다
    const season = currentSeason();
    const policy = season ? season.discount_proof_policy : null;
    const askAlt = ask && state.proofStatus === 'UNAVAILABLE' && policy === 'GRADE_CHANGE';
    if(askAlt) fillAltGradeSelect();
    $('altGradeExtra').classList.toggle('open', askAlt);
    if(!askAlt) state.altGradeName = null;

    renderFactLine();
  }

  $('altGradeSelect').addEventListener('change', ()=>{
    state.altGradeName = $('altGradeSelect').value || null;
    renderFactLine();
  });

  /* ---------------------------------------------------------
     세그먼트 토글 바인딩
  --------------------------------------------------------- */
  segBind('matinee', v=>{ state.matinee=v; resolveSelectedDiscount(); renderFactLine(); updateProgress(); });

  segBind('proofStatus', v=>{
    state.proofStatus=v;
    syncTicketFields();
    updateProgress();
  });

  segBind('casting', v=>{
    state.casting=v;
    updateProgress();
  });

  segBind('actorPathSide', v=>{ state.actorPathSide=v; });

  segBind('firstWatch', v=>{
    state.firstWatch=v;
    // 자첫이면 작품을 본 적이 없으니 선호도를 물을 수 없다
    const askAffinity = v === 'NO';
    $('workAffinityExtra').classList.toggle('open', askAffinity);
    if(!askAffinity){
      state.workAffinity = null;
      document.querySelectorAll('[data-group="workAffinity"] button').forEach(b=>b.classList.remove('active'));
    }
    // 자첫이면 LOYALTY가 기준선에서 빠진다 (§1.3) — 사다리를 다시 계산한다
    renderFactLine();
    updateProgress();
  });
  segBind('workAffinity', v=>{ state.workAffinity=v; updateProgress(); });
  segBind('operaGlass', v=>{ state.operaGlass=v; updateProgress(); });

  segBind('eventExists', v=>{ state.eventExists=v; updateProgress(); });

  segBind('giftDistribution', v=>{ state.giftDistribution=v; });
  segBind('pointMultiplier', v=>{ state.pointMultiplier=v; });

  /* ---------------------------------------------------------
     기타란 접기/펼치기
  --------------------------------------------------------- */
  $('freetextToggle').addEventListener('click', ()=>{
    $('freetextToggle').classList.toggle('open');
    $('freetextWrap').classList.toggle('open');
  });

  /* ---------------------------------------------------------
     텍스트/숫자 입력 변화 감지 (progress 갱신용)
  --------------------------------------------------------- */
  ['workTitle','sessionDate','seatFloor','seatRowInput','seatNumber','paidAmount']
    .forEach(id=> $(id).addEventListener('input', updateProgress));
  $('seatFloor').addEventListener('change', updateProgress);

  // 공연·날짜가 바뀌면 사다리가 통째로 바뀌고, 좌석이 바뀌면 등급이 바뀌어
  // 등급별로 나뉜 할인의 적용 항목이 바뀐다.
  ['workTitle','sessionDate'].forEach(id=>
    $(id).addEventListener('input', ()=>{ fillDiscountButtons(); syncTicketFields(); }));
  function onSeatOrPaidChange(){ resolveSelectedDiscount(); syncTicketFields(); }
  ['seatFloor','seatRowInput','seatNumber','paidAmount'].forEach(id=>
    $(id).addEventListener('input', onSeatOrPaidChange));
  $('seatFloor').addEventListener('change', onSeatOrPaidChange);

  fillDiscountButtons();

  /* ---------------------------------------------------------
     완성도 계산 (필수 9항목) → 스포트라이트 반영
  --------------------------------------------------------- */
  const REQUIRED_CHECKS = [
    ()=> $('workTitle').value.trim().length>0,
    ()=> $('sessionDate').value.length>0 && state.matinee!==null,
    ()=> $('seatFloor').value && $('seatRowInput').value.trim() && $('seatNumber').value,
    // 할인 목록이 없어도 정가/할인받음 버튼은 있으니 항상 하나는 골라야 한다
    ()=> Number($('paidAmount').value)>0
         && state.selectedDiscount !== ''
         && (!needsProof() || state.proofStatus !== null),
    ()=> state.casting!==null,
    ()=> state.firstWatch!==null && (state.firstWatch==='YES' || state.workAffinity!==null),
    ()=> state.operaGlass!==null,
    ()=> state.prefRank.length>=1,
    ()=> state.disposal.size>0
  ];

  function computeProgress(){
    const filled = REQUIRED_CHECKS.filter(fn=>fn()).length;
    return filled / REQUIRED_CHECKS.length;
  }

  function updateProgress(){
    const p = computeProgress();
    const spot = $('spotlight');
    const seatRow = $('seatRow');
    spot.style.setProperty('--spot-w', (40 + p*260) + 'px');
    spot.style.setProperty('--spot-a', (0.10 + p*0.55).toFixed(2));
    seatRow.style.setProperty('--seat-b', (0.40 + p*0.65).toFixed(2));
    seatRow.style.setProperty('--seat-s', (0.45 + p*0.6).toFixed(2));
    $('progressNote').textContent = Math.round(p*100) + '%';

    // 이벤트 화면에서는 끌림도·희소성(PRD §3.3 4·5단계)까지 받아야 넘어간다
    const eventReady = state.appeal !== null && state.scarcity !== null;
    const startBtn = $('startBtn');
    const ready = (state.loggedIn || state.preview) && p >= 1 && (!state.onEventScreen || eventReady);
    startBtn.disabled = !ready;
    startBtn.classList.toggle('ready', ready);
  }

  /* ---------------------------------------------------------
     좌석 열 렌더 (개수는 항목 수와 무관, 고정 6석) — 실사 사진이라
     칸이 넓어져서, 예전 10칸 그대로 두면 옆으로 넘친다.
  --------------------------------------------------------- */
  const seatRowEl = $('seatRow');
  for(let i=0;i<6;i++){
    const seat = document.createElement('img');
    seat.className = 'seat';
    seat.src = 'assets/landing/chair.png';
    seat.alt = '';
    seat.decoding = 'async';
    seatRowEl.appendChild(seat);
  }

  /* ---------------------------------------------------------
     로그인 (Supabase Auth) — 로그인해야 상담을 시작할 수 있다
  --------------------------------------------------------- */
  let authMode = 'signin';   // 'signin' | 'signup'

  function enterAuthed(user){
    state.loggedIn = true;
    $('authBackdrop').hidden = true;
    $('loginBtn').textContent = '로그아웃';
    $('historyBtn').hidden = false;
    const chip = $('userChip');
    chip.hidden = false;
    chip.textContent = user && user.email ? user.email : '로그인됨';
    $('consultForm').classList.add('is-lit');
    updateProgress();
    checkPendingFeedback();
  }
  function exitAuthed(){
    state.loggedIn = false;
    $('loginBtn').textContent = '로그인';
    $('historyBtn').hidden = true;
    if(state.preview){ $('userChip').textContent = '미리보기 모드'; $('userChip').hidden = false; }
    else $('userChip').hidden = true;
    $('consultForm').classList.toggle('is-lit', state.preview);
    // 모달을 자동으로 다시 띄우지 않는다 — 비활성 화면을 보여준다 (design.md)
    updateProgress();
  }
  function openAuth(){
    if(!window.GON_AUTH || !GON_AUTH.ready()){
      $('authIntro').textContent = '로그인 기능을 쓸 수 없어요. 인터넷 연결과 data/supabase-config.js 를 확인하세요.';
    } else {
      setAuthMode('signin');
      $('authError').hidden = true;
    }
    $('authBackdrop').hidden = false;
  }
  function closeAuth(){ $('authBackdrop').hidden = true; }
  function setAuthMode(mode){
    authMode = mode;
    const signup = mode === 'signup';
    $('authTitle').textContent = signup ? '회원가입' : '로그인';
    $('authSubmit').textContent = signup ? '가입하고 시작' : '로그인';
    $('authToggle').textContent = signup ? '로그인으로' : '회원가입으로';
    $('authPw').autocomplete = signup ? 'new-password' : 'current-password';
  }

  $('authToggle').addEventListener('click', ()=> setAuthMode(authMode === 'signup' ? 'signin' : 'signup'));

  $('authSubmit').addEventListener('click', async ()=>{
    const email = $('authEmail').value.trim();
    const pw = $('authPw').value;
    const err = $('authError');
    err.hidden = true;
    if(!email || !pw){ err.textContent = '이메일과 비밀번호를 입력하세요.'; err.hidden = false; return; }
    $('authSubmit').disabled = true;
    try{
      const { data, error } = authMode === 'signup'
        ? await GON_AUTH.signUp(email, pw)
        : await GON_AUTH.signIn(email, pw);
      if(error) throw error;
      if(authMode === 'signup' && !(data && data.session)){
        err.textContent = '가입은 됐지만 로그인 세션이 없어요. Supabase Auth 에서 "Confirm email" 을 꺼주세요.';
        err.hidden = false;
        return;
      }
      const user = (data && data.user) || await GON_AUTH.user();
      enterAuthed(user);
    }catch(e){
      err.textContent = (e && e.message) || '로그인에 실패했어요.';
      err.hidden = false;
    }finally{
      $('authSubmit').disabled = false;
    }
  });

  $('loginBtn').addEventListener('click', async ()=>{
    if(state.loggedIn){ await GON_AUTH.signOut(); exitAuthed(); }
    else openAuth();
  });

  $('authClose').addEventListener('click', closeAuth);
  $('authBackdrop').addEventListener('click', (e)=>{ if(e.target === $('authBackdrop')) closeAuth(); });

  $('historyBtn').addEventListener('click', ()=>{ $('historyBackdrop').hidden = false; loadHistory(); });
  $('historyClose').addEventListener('click', ()=>{ $('historyBackdrop').hidden = true; });
  $('historyBackdrop').addEventListener('click', (e)=>{
    if(e.target === $('historyBackdrop')) $('historyBackdrop').hidden = true;
  });

  async function loadHistory(){
    const body = $('historyBody');
    body.innerHTML = '<p>불러오는 중…</p>';
    try{
      const { data, error } = await GON_AUTH.listConsultations();
      if(error) throw error;
      if(!data || !data.length){
        body.innerHTML = '<p>아직 완료된 상담이 없습니다.<br>상담을 마치면 이 곳에 기록이 쌓여요.</p>';
        return;
      }
      const V = { GO:'가라', NO_GO:'가지마라' };
      const RES = { WENT:'다녀옴', GAVE:'나눔', SKIP:'안 감' };
      const todayStr = new Date().toISOString().slice(0,10);
      body.innerHTML = data.map(r=>{
        const seat = r.seat || {};
        const seatStr = [seat.floor?seat.floor+'층':'', seat.block||'', seat.row?seat.row+'열':'', seat.number?seat.number+'번':'']
          .filter(Boolean).join(' ') || '자리 미상';
        const vcls = r.verdict === 'GO' ? 'go' : (r.verdict === 'NO_GO' ? 'nogo' : '');
        const paid = (r.paid!=null) ? Number(r.paid).toLocaleString()+'원' : '';
        const d = (r.consulted_at||'').slice(0,10);
        let statusStr = '';
        if(r.outcome && r.outcome.result){
          statusStr = RES[r.outcome.result] || '';
        } else if(r.session_date && r.session_date >= todayStr){
          statusStr = '관람 예정';
        }
        return '<div class="hist-row">'
          + '<span class="hist-title">'+esc(r.work_title||'?')+(r.season_label?' · '+esc(r.season_label):'')+'</span>'
          + '<span class="hist-verdict '+vcls+'">'+(V[r.verdict]||r.verdict||'-')+'</span>'
          + '<span class="hist-meta">'+esc(seatStr)+(paid?' · '+paid:'')
          + (r.session_date?' · 관람 '+r.session_date:'')+' · 상담 '+d
          + (statusStr?' · '+statusStr:'')+'</span>'
          + '</div>';
      }).join('');
    }catch(e){
      body.innerHTML = '<p>불러오지 못했어요: '+esc((e&&e.message)||'오류')+'</p>';
    }
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------------------------------------------------------
     사후 피드백 모달 — PRD §3.6 · §10.1

     로그인 직후, 관람일이 지났는데 아직 결과를 안 받은 상담이 있으면
     한 번에 하나만 묻는다. "나중에" 를 누르면 그 건은 localStorage 로
     계속 스킵한다 (§10.3 — 자주 물으면 이탈).
  --------------------------------------------------------- */
  const fb = { rec:null, result:null, seat_sat:null, gift_sat:null, hasEvent:false };

  function snoozeKey(id){ return 'gon:snooze:' + id; }
  function isSnoozed(id){
    try{ return !!localStorage.getItem(snoozeKey(id)); }catch(e){ return false; }
  }
  function snooze(id){
    try{ localStorage.setItem(snoozeKey(id), String(Date.now())); }catch(e){}
  }

  async function checkPendingFeedback(){
    if(!window.GON_AUTH || !GON_AUTH.ready()) return;
    let rows;
    try{
      const { data, error } = await GON_AUTH.listConsultations();
      if(error) throw error;
      rows = data || [];
    }catch(e){ return; }

    const todayStr = new Date().toISOString().slice(0,10);
    const pending = rows.filter(r=>
      r.session_date && r.session_date < todayStr &&   // 관람일이 지났고
      !r.outcome &&                                    // 아직 결과 미입력
      !isSnoozed(r.id)                                 // "나중에" 로 미룬 적 없음
    );
    // 오래된 관람부터
    pending.sort((a,b)=> a.session_date < b.session_date ? -1 : 1);
    if(pending.length) openFeedback(pending[0]);
  }

  function openFeedback(rec){
    fb.rec = rec;
    fb.result = null; fb.seat_sat = null; fb.gift_sat = null;
    // EVENT 축 점수가 남아 있으면 이벤트가 있었던 회차다 (muted 면 null)
    fb.hasEvent = !!(rec.axis_scores && rec.axis_scores.EVENT != null);

    const seat = rec.seat || {};
    const seatStr = [seat.floor?seat.floor+'층':'', seat.block||'', seat.row?seat.row+'열':'', seat.number?seat.number+'번':'']
      .filter(Boolean).join(' ');
    $('fbContext').textContent = (rec.work_title||'?')
      + (rec.season_label ? ' · ' + rec.season_label : '')
      + (rec.session_date ? ' · ' + rec.session_date + ' 관람' : '')
      + (seatStr ? ' · ' + seatStr : '');

    document.querySelectorAll('#feedbackBackdrop [data-group="fbResult"] button, #feedbackBackdrop .scale-btn')
      .forEach(b=> b.classList.remove('active'));
    $('fbStepSeat').hidden = true;
    $('fbStepGift').hidden = true;
    $('fbSubmit').disabled = true;
    $('feedbackBackdrop').hidden = false;
  }

  function fbSync(){
    const r = fb.result;
    const askSeat = r === 'WENT';
    const askGift = (r === 'WENT' || r === 'GAVE') && fb.hasEvent;
    $('fbStepSeat').hidden = !askSeat;
    $('fbStepGift').hidden = !askGift;
    if(!askSeat) fb.seat_sat = null;
    if(!askGift) fb.gift_sat = null;

    let ready = false;
    if(r === 'SKIP') ready = true;
    else if(r === 'WENT') ready = fb.seat_sat !== null && (!askGift || fb.gift_sat !== null);
    else if(r === 'GAVE') ready = !askGift || fb.gift_sat !== null;
    $('fbSubmit').disabled = !ready;
  }

  segBind('fbResult', v=>{
    fb.result = v;
    fb.seat_sat = null; fb.gift_sat = null;
    document.querySelectorAll('#fbSeatScale .scale-btn, #fbGiftScale .scale-btn')
      .forEach(b=> b.classList.remove('active'));
    fbSync();
  });

  [['fbSeatScale','seat_sat'], ['fbGiftScale','gift_sat']].forEach(([grid, key])=>{
    document.querySelectorAll('#'+grid+' .scale-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#'+grid+' .scale-btn').forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
        fb[key] = Number(btn.dataset.value);
        fbSync();
      });
    });
  });

  $('fbLater').addEventListener('click', ()=>{
    if(fb.rec) snooze(fb.rec.id);
    $('feedbackBackdrop').hidden = true;
  });

  $('fbSubmit').addEventListener('click', async ()=>{
    if($('fbSubmit').disabled || !fb.rec) return;
    const outcome = { result: fb.result };
    if(fb.seat_sat !== null) outcome.seat_sat = fb.seat_sat;
    if(fb.gift_sat !== null) outcome.gift_sat = fb.gift_sat;
    $('fbSubmit').disabled = true;
    try{
      const { error } = await GON_AUTH.updateOutcome(fb.rec.id, outcome);
      if(error) throw error;
    }catch(e){
      // 저장 실패 — 이번엔 접고 다음 접속 때 다시 묻는다
      console.warn('[GON] 피드백 저장 실패:', (e && e.message) || e);
    }
    $('feedbackBackdrop').hidden = true;
  });

  // ?preview 또는 #preview — 로그인 없이 화면/폼을 켜서 확인하는 개발용 모드.
  // (file:// 에서 쿼리스트링이 잘리는 브라우저가 있어 해시·href 도 함께 본다.)
  // 상담기록은 세션이 없어 저장되지 않는다 (consult.html 이 알아서 스킵).
  state.preview = /(\?|&|#)preview\b/.test(location.href) ||
                  new URLSearchParams(location.search).has('preview');
  if(state.preview){
    $('consultForm').classList.add('is-lit');
    const chip = $('userChip');
    chip.hidden = false;
    chip.textContent = '미리보기 모드';
  }

  // 시작 시 세션 확인 — 로그인 안 돼 있으면 모달을 자동으로 띄우지 않고
  // 비활성(어두운) 화면을 보여준다. 로그인은 상단 "로그인" 버튼으로.
  (async ()=>{
    if(!window.GON_AUTH || !GON_AUTH.ready()) return;
    const user = await GON_AUTH.user();
    if(user) enterAuthed(user);
    GON_AUTH.onChange((u)=>{ if(!u && state.loggedIn) exitAuthed(); });
  })();

  /* ---------------------------------------------------------
     이벤트 종류 pill (복수 선택) + 세부 블록 토글
  --------------------------------------------------------- */
  document.querySelectorAll('#eventTypePills .pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      const v = pill.dataset.value;
      if(state.eventTypes.has(v)){ state.eventTypes.delete(v); pill.classList.remove('active'); }
      else { state.eventTypes.add(v); pill.classList.add('active'); }
      $('giftDetail').classList.toggle('show', state.eventTypes.has('GIFT'));
      $('pointDetail').classList.toggle('show', state.eventTypes.has('POINT'));
    });
  });

  document.querySelectorAll('#appealScale .scale-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#appealScale .scale-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.appeal = btn.dataset.value;
      updateProgress();
    });
  });
  document.querySelectorAll('#scarcityScale .scale-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#scarcityScale .scale-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.scarcity = btn.dataset.value;
      updateProgress();
    });
  });

  /* ---------------------------------------------------------
     공통 입력 번들 (PRD §6.1)

     DB가 아직 없어 자동 산출이 불가능한 필드(좌석 등급·통로 여부·정가·
     할인 사다리·관람 이력)는 null로 둔다. 엔진이 missing_info에
     기록하고 confidence를 낮춘다 — 모르는 것을 지어내지 않는다(PRD 원칙 6).

     v2.1 §6.5: payment 는 band 까지 확정해서 넘긴다. today_cast·
     favorite_actors_today·remaining_favorite_sessions 는 삭제됐다 —
     배우 이름을 받지 않으므로 매칭 경로가 아예 없다(§3.1).
  --------------------------------------------------------- */
  const EVENT_LABELS = {
    GIFT:'증정', POINT:'적립 혜택', PHOTO:'커튼콜 데이',
    SPECIAL_CC:'스페셜 커튼콜/장면 시연', LUCKY:'럭키드로우',
    GREETING:'무대인사', SIGN:'사인회', GV:'관객과의 대화(GV)'
  };
  // 이벤트 정보가 사전에 확정되는가 (PRD §5.4 irreplaceable 3단계)
  const CERTAINTY = {
    GIFT:'FIXED', POINT:'FIXED', PHOTO:'FIXED', SPECIAL_CC:'FIXED',
    GREETING:'FIXED', GV:'FIXED',
    LUCKY:'CHANCE', SIGN:'CHANCE'
  };
  // 애배가 안 나오면 가치가 급락하는 유형 (PRD §5.4 배우 매개형)
  const ACTOR_MEDIATED = new Set(['PHOTO','SPECIAL_CC','GREETING','SIGN','GV']);

  function buildEvents(){
    if(state.eventExists !== 'YES') return [];
    const types = Array.from(state.eventTypes);
    const custom = $('eventCustom').value.trim();
    if(custom) types.push('CUSTOM');
    return types.map(t=>({
      type: t,
      label: t === 'CUSTOM' ? custom : EVENT_LABELS[t],
      item: t === 'GIFT' ? ($('giftItem').value.trim() || null) : null,
      distribution: t === 'GIFT' ? state.giftDistribution : null,
      point_multiplier: t === 'POINT' ? state.pointMultiplier : null,
      participating_actors: null,
      photo_allowed: t === 'PHOTO',
      is_actor_mediated: ACTOR_MEDIATED.has(t),
      certainty_class: CERTAINTY[t] || 'FIXED',
      user_appeal: state.appeal === null ? null : Number(state.appeal),
      user_scarcity: state.scarcity
    }));
  }

  function buildBundle(){
    const dateStr = $('sessionDate').value;
    // 낮공 14시 / 밤공 19시로 가정한다. 폼에 시각 입력이 없다.
    const hour = state.matinee === 'MATINEE' ? 14 : 19;
    const sessionDatetime = dateStr ? dateStr + 'T' + String(hour).padStart(2,'0') + ':00:00' : null;

    // 수집 데이터 조회 (PRD §9.2 — 상담 시점에는 크롤링하지 않고 DB만 본다)
    const title = $('workTitle').value.trim();
    const season = GON_DB.findSeason(title, dateStr);
    const venue  = season ? GON_DB.findVenue(season.venue_id) : null;

    const seatIn = {
      floor: $('seatFloor').value ? Number($('seatFloor').value) : null,
      row: $('seatRowInput').value.trim(),
      number: $('seatNumber').value ? Number($('seatNumber').value) : null,
      // 블럭 표기 — 사이드 구간 분류(PRD §5.2)에서 블럭 매칭에 쓴다
      block: $('seatBlock').value.trim() || null
    };
    const seatInfo = GON_DB.resolveSeat(season, seatIn);

    return {
      schema_version: 1,
      season: {
        id: season ? season.season_id : null,
        work_title: title,
        season_label: season ? season.season_label : null,
        venue_id: season ? season.venue_id : null,
        venue_name: venue ? venue.name : null,
        running_time: season ? season.running_time : null,
        has_intermission: season ? season.has_intermission : null,
        open_date: season ? season.open_date : null,
        close_date: season ? season.close_date : null,
        cancellation_policy: GON_DB.cancellationPolicy(season)
      },
      session: {
        date: dateStr || null,
        datetime: sessionDatetime,
        matinee_or_evening: state.matinee,
        // 첫공·막공은 기타란에 언급이 있을 때만 덕심이 읽는다 (v2.1 §3.3)
        now: new Date().toISOString()
      },
      seat: {
        floor: seatIn.floor,
        block: $('seatBlock').value.trim() || null,
        row: seatIn.row,
        number: seatIn.number,
        // 아래는 DB에서 자동 산출한다. 모르면 null — false 가 아니다
        grade: seatInfo.grade,
        is_aisle: seatInfo.is_aisle,
        is_restricted: seatInfo.is_restricted,
        zone: seatInfo.zone,
        side_zone: seatInfo.side_zone,          // 'EDGE' | 'SIDE' | null (PRD §5.2)
        side_block: seatInfo.side_block,
        side_source: seatInfo.side_source,      // 'season' | 'venue' | null
        side_estimate: seatInfo.side_estimate,
        row_index: GON_DB.rowIndex(seatIn.row, venue),
        row_index_in_floor: GON_DB.rowIndexWithinFloor(seatIn.row, seatIn.floor, venue),
        notes: seatInfo.notes,
        sources: seatInfo.sources,
        unknown: seatInfo.unknown
      },
      // band 까지 여기서 확정한다. 엔진은 산수를 하지 않는다 (v2.1 §1.7)
      payment: buildPayment(),
      season_progress: GON_DB.seasonProgress(season),   // v2.1 §3.2
      coverage: GON_DB.coverage(season, seatInfo),
      disposal_options: Array.from(state.disposal),
      casting: { has_favorite_actor: state.casting === 'YES' },
      first_watch: state.firstWatch === 'YES',
      work_affinity: state.workAffinity,   // 자첫이면 null — 덕심이 기타란으로 폴백한다
      seat_preference: {
        first: state.prefRank[0] || null,
        second: state.prefRank[1] || null,
        actor_path_side: state.actorPathSide
      },
      opera_glass: state.operaGlass === 'YES',
      events: buildEvents(),
      history: {
        this_work_count: null,
        this_pair_count: null,
        recent_30d_count: null
      },
      free_text: $('freeText').value.trim() || null
    };
  }

  /* ---------------------------------------------------------
     상담 시작 / 이벤트 화면 전환
  --------------------------------------------------------- */
  $('startBtn').addEventListener('click', ()=>{
    if($('startBtn').disabled) return;

    if(!state.onEventScreen && state.eventExists === 'YES'){
      // 이벤트가 있으면 두 번째 화면으로 (design.md §3.3)
      state.onEventScreen = true;
      $('consultForm').style.display = 'none';
      $('eventScreen').hidden = false;
      $('startBtn').textContent = '확인하고 상담 시작';
      updateProgress();
      return;
    }

    // 완료 → 조명이 완전히 들어오며 상담실로 전환 (design.md §3.4)
    try{
      sessionStorage.setItem('gon:bundle', JSON.stringify(buildBundle()));
    }catch(e){
      // 시크릿 모드 등에서 sessionStorage가 막히면 상담실이 데모 데이터로 뜬다
      console.warn('번들 저장 실패 — 상담실이 데모 데이터로 열립니다.', e);
    }

    const overlay = $('transitionOverlay');
    overlay.querySelector('span').textContent = '상담실로 들어갑니다…';
    overlay.classList.add('show');
    // 상담실(consult.html)이 판정 후 상담기록을 저장할 수 있도록 세션을 넘긴다
    Promise.resolve(GON_AUTH.stashSession()).catch(()=>{}).then(()=>{
      setTimeout(()=>{ location.href = 'consult.html'; }, 600);
    });
  });

  $('eventBack').addEventListener('click', ()=>{
    state.onEventScreen = false;
    $('eventScreen').hidden = true;
    $('consultForm').style.display = 'flex';
    $('startBtn').textContent = '상담 시작';
    updateProgress();
  });

  /* ---------------------------------------------------------
     관리자 도구 진입 — 우하단 톱니 → admin.html (비밀번호는 그 화면이 물어본다).
     Gemini·service_role 키는 Edge Function 시크릿에만. admin.html 도 비번·이미지만 보냄.
  --------------------------------------------------------- */
  (function(){
    const a = $('adminDot');
    if(a){ a.href = 'admin.html'; a.target = '_blank'; a.rel = 'noopener'; }
  })();

  /* ---------------------------------------------------------
     초기 렌더
  --------------------------------------------------------- */
  renderPrefRanks();
  updateProgress();
})();
</script>
</body>
</html>
