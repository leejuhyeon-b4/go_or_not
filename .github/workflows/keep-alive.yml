name: Supabase keep-alive

# Supabase 무료 프로젝트는 일정 기간 요청이 없으면 일시정지된다.
# 5일에 한 번 아무 테이블 1행만 읽어서 프로젝트를 깨워 둔다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              예: https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  publishable(anon) 키 — 읽기 전용, RLS 로 통제됨

on:
  schedule:
    # 매월 1·6·11·16·21·26일 06:00 UTC (≈ 5일 간격)
    - cron: "0 6 */5 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secret 이 없습니다."
            exit 1
          fi
          echo "GET ${SUPABASE_URL}/rest/v1/venues?select=venue_id&limit=1"
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/venues?select=venue_id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}"
          echo
          echo "keep-alive OK"
